<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPM Exam Coach — AIPMM Certified Product Manager</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#1c2333;--mut:#6b7280;--acc:#4353ff;--acc2:#eef0ff;--ok:#0e9f6e;--okbg:#e6f7f1;--bad:#e02424;--badbg:#fdeaea;--warn:#c27803;--line:#e5e7eb;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;font-weight:700;margin-right:auto;cursor:pointer}
header h1 span{color:var(--acc)}
.vtoggles{display:flex;gap:8px;align-items:center}
.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none;transition:.15s}
.tog.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
main{max-width:860px;margin:0 auto;padding:22px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h2{font-size:20px;margin-bottom:6px}
h3{font-size:15px;margin:14px 0 6px}
.sub{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:.15s}
.mode:hover{border-color:var(--acc);box-shadow:0 4px 14px rgba(67,83,255,.10);transform:translateY(-1px)}
.mode .ic{font-size:24px}.mode b{display:block;margin:6px 0 3px;font-size:15px}.mode p{font-size:12.5px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:600}
.btn{background:var(--acc);color:#fff}.btn:hover{filter:brightness(1.08)}
.btn2{background:var(--acc2);color:var(--acc)}.btn2:hover{background:#e2e6ff}
.btn3{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--acc);background:var(--acc2);border-radius:20px;padding:3px 10px;margin-bottom:8px}
.bar{height:9px;background:#edeef3;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .4s}
.dstat{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-top:12px}
.dstat b{font-weight:600}.dstat span{color:var(--mut);font-size:12px}
.q{font-size:17px;font-weight:600;margin:10px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;font-weight:500;font-size:14.5px;color:var(--ink);transition:.12s}
.opt:hover{border-color:var(--acc)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.expl{border-radius:12px;padding:14px 16px;margin:10px 0;font-size:14px}
.expl.good{background:var(--okbg);border:1px solid #b7e6d4}.expl.poor{background:var(--badbg);border:1px solid #f5c6c6}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);flex-wrap:wrap;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink);background:var(--acc2);padding:4px 12px;border-radius:8px}
.timer.low{color:var(--bad);background:var(--badbg)}
.mic{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);margin-top:10px;min-height:20px}
.mic .dot{width:9px;height:9px;border-radius:50%;background:#cbd0da}
.mic.live .dot{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.fc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:38px 26px;text-align:center;cursor:pointer;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fc .f{font-size:18px;font-weight:650}.fc .b{font-size:15.5px;color:var(--ink)}
.fc .hint{font-size:12px;color:var(--mut)}
.score{font-size:42px;font-weight:800}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.trap{background:#fff8e6;border:1px solid #f3dfa3;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.learn h3{color:var(--acc);margin-top:18px}
.learn p{font-size:14px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ready{font-size:13px;padding:10px 14px;border-radius:10px;margin-top:12px}
.ready.g{background:var(--okbg)}.ready.y{background:#fff8e6}.ready.r{background:var(--badbg)}
.crumb{font-size:13px;color:var(--acc);cursor:pointer;font-weight:600;margin-bottom:10px;display:inline-block}
kbd{background:#eef0f4;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:inherit}
.small{font-size:12px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')">CPM Exam <span>Coach</span></h1>
  <div class="vtoggles">
    <div class="tog" id="togOut" onclick="toggleVoice('out')">🔊 Read aloud</div>
    <div class="tog" id="togIn" onclick="toggleVoice('in')">🎙️ Voice answers</div>
  </div>
</header>
<main id="view"></main>
<script>
"use strict";
const QB=[];
QB.push(
{d:1,q:"A product has reached the maturity stage. Sales are flat and margins are declining due to increased competition. Which strategy is MOST appropriate?",c:["Increase production capacity","Launch aggressive discounting to gain volume","Segment the market and focus on profitable niches while reducing costs","Immediately retire the product"],a:2,x:"In maturity, the goal is extending profitability through segmentation, differentiation, and cost management — not mass discounting or immediate retirement."},
{d:1,q:"In a Stage-Gate process, what is the PRIMARY purpose of a gate?",c:["To add checkpoints that slow development","To make Go/No-Go/Hold/Recycle decisions and control investment","To notify customers of upcoming releases","To transfer ownership from engineering to marketing"],a:1,x:"Gates are investment control and decision checkpoints where cross-functional leadership decides Go, No-Go, Hold, or Recycle."},
{d:1,q:"Which product lifecycle stage typically involves the HIGHEST marketing spend relative to revenue?",c:["Growth","Maturity","Decline","Introduction"],a:3,x:"Introduction requires heavy marketing investment to build awareness while revenue is still minimal."},
{d:1,q:"What is the correct order of the four classic Product Lifecycle (PLC) stages?",c:["Introduction, Maturity, Growth, Decline","Introduction, Growth, Maturity, Decline","Growth, Introduction, Maturity, Decline","Conceive, Plan, Develop, Launch"],a:1,x:"The classic PLC runs Introduction → Growth → Maturity → Decline. Conceive/Plan/Develop are ProdBOK phases, not PLC stages."},
{d:1,q:"What is the correct sequence of ProdBOK lifecycle phases?",c:["Plan, Conceive, Develop, Launch, Qualify, Deliver, Retire","Conceive, Plan, Develop, Qualify, Launch, Deliver, Retire","Conceive, Develop, Plan, Launch, Qualify, Retire, Deliver","Plan, Develop, Test, Launch, Grow, Mature, Decline"],a:1,x:"ProdBOK: Conceive → Plan → Develop → Qualify → Launch → Deliver → Retire, each preceded by a cross-functional gate."},
{d:1,q:"During which PLC stage do profits typically peak?",c:["Introduction","Growth","Maturity","Decline"],a:2,x:"Profits generally peak in early maturity: sales are at their highest and development costs have been absorbed, before competitive pressure erodes margins."},
{d:1,q:"A gate review results in a 'Recycle' decision. What does this mean?",c:["The product is retired and materials are recycled","The project returns to the previous phase to rework deliverables before advancing","The project is paused indefinitely","The budget is reallocated to another product"],a:1,x:"Recycle sends the project back to redo or improve phase deliverables; Hold pauses it, No-Go kills it."},
{d:1,q:"In Stage-Gate, how does resource commitment typically change across successive phases?",c:["It stays constant to keep budgets predictable","It decreases as uncertainty falls","It increases with each successive phase","It is fully committed at the first gate"],a:2,x:"Stage-Gate is an incremental-commitment model: investment grows phase by phase as uncertainty is reduced."},
{d:1,q:"The primary purpose of screening during the early gates is to:",c:["Finalize the product's pricing","Reduce a large set of ideas to a viable few worth investment","Assign engineers to the project","Create the launch plan"],a:1,x:"Screening evaluates new product ideas against criteria (strategic fit, market attractiveness, feasibility, financial return) to narrow the funnel."},
{d:1,q:"Which is NOT a typical gate criterion in Stage-Gate?",c:["Strategic alignment","Market attractiveness","Technical feasibility","The development team's vacation schedule"],a:3,x:"Gate criteria are strategic alignment, market attractiveness, technical feasibility, and financial return — not staffing logistics."},
{d:1,q:"A product in the Growth stage should generally focus on:",c:["Harvesting profits and cutting all investment","Scaling production, expanding distribution, and refining positioning","Retiring weak SKUs and archiving documentation","Running end-of-life notifications"],a:1,x:"Growth demands scaling to meet demand, expanding channels, and sharpening positioning as competitors enter."},
{d:1,q:"In the Decline stage, 'harvesting' a product means:",c:["Selling the product line to a competitor","Reducing investment while continuing to collect profits from remaining sales","Increasing R&D to revive growth","Bundling it with new products"],a:1,x:"Harvest = minimize spend, maximize remaining cash flow. Divest = sell; reposition = re-invest for a new segment."},
{d:1,q:"Which BCG Matrix category describes a product with high market share in a low-growth market?",c:["Star","Question Mark","Cash Cow","Dog"],a:2,x:"Cash Cows: high share, low growth — they fund other investments. Stars are high/high; Dogs low/low; Question Marks low share/high growth."},
{d:1,q:"A product with low market share in a high-growth market is a:",c:["Cash Cow","Dog","Star","Question Mark"],a:3,x:"Question Marks need a decision: invest to grow share, or divest."},
{d:1,q:"Which portfolio decision is MOST appropriate for a Dog?",c:["Heavy investment to convert it to a Star","Harvest or divest","Increase marketing spend","Use it to fund Question Marks"],a:1,x:"Dogs (low share, low growth) rarely justify investment; harvest or divest is standard. Cash Cows fund other products."},
{d:1,q:"Which is a valid criterion for retiring a product?",c:["The product just launched last quarter","Declining sales, negative margins, or strategic misalignment","The engineering team wants a new project","A competitor lowered prices once"],a:1,x:"EOL decisions rest on sustained decline, unprofitability, or misfit with strategy — not novelty-seeking or single competitor moves."},
{d:1,q:"Which activity belongs in a proper End-of-Life (EOL) process?",c:["Customer notification and support wind-down","Hiding the retirement from existing customers","Immediately deleting all product documentation","Doubling the price to force churn"],a:0,x:"A responsible EOL includes notifying customers, winding down support in stages, and archiving documentation."},
{d:1,q:"True or False: In the ProdBOK framework, each lifecycle phase is preceded by a cross-functional gate.",c:["True","False"],a:0,x:"True — every phase transition is governed by a gate with Go/No-Go/Hold/Recycle outcomes."},
{d:1,q:"During Introduction, which pricing approach is used to quickly build market share?",c:["Skimming","Penetration","Cost-plus","Prestige"],a:1,x:"Penetration pricing sets a low initial price to gain share fast; skimming starts high and drops over time."},
{d:1,q:"Skimming pricing is MOST appropriate when:",c:["The product is undifferentiated and competition is fierce","Early adopters will pay a premium for an innovative product","The company needs maximum unit volume immediately","The product is in decline"],a:1,x:"Skimming captures value from price-insensitive early adopters of innovative products (e.g., consumer electronics), then lowers price over time."},
{d:1,q:"Competition typically begins entering the market in force during which PLC stage?",c:["Introduction","Growth","Maturity","Decline"],a:1,x:"Rapid sales growth attracts competitors during the Growth stage; by Maturity the market is crowded."},
{d:1,q:"A PM notices a mature product's sales dipping as customers shift to the company's own newer product. This is called:",c:["Market saturation","Cannibalization","Diversification","Substitution threat"],a:1,x:"Cannibalization is when a company's new product takes sales from its own existing products — sometimes acceptable if planned."},
{d:1,q:"In the Qualify phase of ProdBOK, the team primarily:",c:["Generates new product ideas","Tests and validates the product before launch","Retires legacy versions","Negotiates supplier contracts"],a:1,x:"Qualify is the testing/validation phase (alpha, beta, QA) confirming the product is ready for Launch."},
{d:1,q:"The Deliver phase of ProdBOK covers:",c:["Initial concept scoring","Ongoing operation, support, and optimization of the product in market","Writing the business case","Prototype development"],a:1,x:"Deliver is the post-launch, in-market phase: managing, supporting, and optimizing the live product."},
{d:1,q:"Which stage's PM actions include awareness campaigns, distribution setup, and pricing strategy?",c:["Introduction","Growth","Maturity","Decline"],a:0,x:"These are launch-adjacent actions of Introduction, when awareness and availability must be established."},
{d:1,q:"Which stage's PM actions center on product enhancements, cost reduction, and market segmentation?",c:["Introduction","Growth","Maturity","Decline"],a:2,x:"Maturity focuses on defending share: enhancements, efficiency, and finding profitable segments."},
{d:1,q:"At a gate meeting, the sponsoring executive says market conditions have shifted and asks the team to pause until next quarter without killing the project. The correct gate decision is:",c:["Go","No-Go","Hold","Recycle"],a:2,x:"Hold pauses the project without terminating it; Recycle would require rework, No-Go kills it."},
{d:1,q:"Portfolio management is BEST described as:",c:["Managing a single product's roadmap","Managing a collection of products across their lifecycles to balance risk and return","Managing the sales pipeline","Tracking competitor products"],a:1,x:"Portfolio management balances investment across products at different lifecycle stages (invest, maintain, harvest, divest)."},
{d:1,q:"Which sequence describes the diffusion of innovation adopter categories?",c:["Early adopters, innovators, early majority, laggards, late majority","Innovators, early adopters, early majority, late majority, laggards","Innovators, early majority, early adopters, late majority, laggards","Early majority, innovators, early adopters, laggards, late majority"],a:1,x:"Rogers' curve: Innovators → Early Adopters → Early Majority → Late Majority → Laggards."},
{d:1,q:"The 'chasm' in technology adoption refers to the gap between:",c:["Innovators and early adopters","Early adopters and the early majority","Early majority and late majority","Late majority and laggards"],a:1,x:"Moore's chasm sits between visionary early adopters and pragmatic early majority buyers, who need proof and whole-product solutions."},
{d:1,q:"True or False: A product can be in the Decline stage of the market lifecycle while still being profitable.",c:["True","False"],a:0,x:"True — declining products with low investment needs can remain profitable, which is exactly the logic of harvesting."},
{d:1,q:"Which document primarily guides the cross-functional activities required to bring a product to market at Launch?",c:["The launch plan (go-to-market plan)","The org chart","The sprint backlog","The support runbook"],a:0,x:"The launch/GTM plan coordinates marketing, sales enablement, channels, pricing, and support readiness for launch."},
{d:1,q:"A gate reviewer asks, 'Does this product still fit our corporate strategy?' Which gate criterion is being applied?",c:["Technical feasibility","Financial return","Strategic alignment","Market attractiveness"],a:2,x:"Strategic alignment tests fit with company strategy; the other criteria test different dimensions."},
{d:1,q:"Sales are rising rapidly, per-unit costs are falling, and new competitors appear monthly. Which stage is this product in?",c:["Introduction","Growth","Maturity","Decline"],a:1,x:"Rapid sales growth, improving economics, and competitor entry are the signature of Growth."},
{d:1,q:"When a mature product faces commoditization, the MOST common defensive play is:",c:["Exit the market immediately","Differentiate through features, service, or brand while managing costs","Raise prices across the board","Stop all marketing"],a:1,x:"Maturity strategy = differentiation plus cost management to defend share and margin."},
{d:1,q:"Which lifecycle concept explains why a company should maintain products in multiple lifecycle stages simultaneously?",c:["Cannibalization","Portfolio balance","Skimming","Whole product"],a:1,x:"A balanced portfolio ensures Cash Cows fund Stars and Question Marks, sustaining revenue as products age."},
{d:1,q:"The MOST appropriate time to begin planning a product's retirement strategy is:",c:["Only after sales go negative","During lifecycle planning, well before decline","Never — retirement is handled by finance","At the first customer complaint"],a:1,x:"EOL should be anticipated in lifecycle planning so migration paths, support commitments, and notifications are orderly."},
{d:1,q:"A 'Go' decision at a gate means:",c:["The project may proceed to the next phase with committed resources","The project is complete","The product launches immediately regardless of phase","Marketing takes over the project"],a:0,x:"Go advances the project into the next phase and commits the resources planned for that phase."},
{d:1,q:"In the Introduction stage, which of the following is typically TRUE?",c:["Profits are high and costs are low","Sales are low and per-customer acquisition cost is high","Competition is at its peak","Distribution is fully built out"],a:1,x:"Introduction features low sales, high costs, limited distribution, and few (if any) competitors."},
{d:1,q:"Which action pairs correctly with the Decline stage?",c:["Building awareness","Scaling production","Deciding to harvest, divest, reposition, or retire","Entering new geographic markets aggressively"],a:2,x:"Decline forces the strategic choice among harvest, divest, reposition, or retire."}
);
QB.push(
{d:1,q:"Inbound product management is BEST described as:",c:["Distributing messages, training salespeople, and running PR","Absorbing market information — customer research, competitive intelligence, trends — and setting product strategy and requirements","Managing inbound customer support tickets","Negotiating with suppliers"],a:1,x:"Inbound PM is the 'radar' of the organization: research, competitive intelligence, requirements, strategy. Outbound pushes messages out (GTM, sales training, PR, advertising)."},
{d:1,q:"Which activity is an OUTBOUND product management function?",c:["Documenting market requirements","Analyzing competitive intelligence","Training the sales force and communicating through advertising and PR","Setting product strategy"],a:2,x:"Outbound = pushing messages to market: sales enablement, GTM, advertising, PR, events. The others are inbound."},
{d:1,q:"In many organizations, the Product Manager is responsible for the product primarily from:",c:["Launch to Retire only","Conceive to Launch, with focus on internal value creation and cost/profit monitoring","Qualify to Deliver only","Marketing campaigns only"],a:1,x:"AIPMM frames PdM as driving Conceive-to-Launch and internal value creation, while PmM focuses on outbound, customer-facing value communication."},
{d:1,q:"A company decides to withdraw a product from its portfolio. Which PLC concept does this correspond to?",c:["Commercialization","Product withdrawal / retirement following Decline","Market development","Qualification"],a:1,x:"Withdrawal (retirement) is the formal removal of a product from the market at the end of Decline."},
{d:1,q:"Commercialization refers to:",c:["The process of taking a product from development into the market to generate sales","Reducing product cost through Six Sigma","Licensing intellectual property","Writing the PRD"],a:0,x:"Commercialization is bringing the product to market — launch plans, production ramp, channel readiness, marketing rollout."},
{d:1,q:"Which methodology focuses on reducing process variation and defects using data (DMAIC)?",c:["Lean","Six Sigma","Scrum","Stage-Gate"],a:1,x:"Six Sigma reduces defects/variation via DMAIC (Define, Measure, Analyze, Improve, Control). Lean focuses on eliminating waste."},
{d:1,q:"Lean methodology primarily aims to:",c:["Add approval gates","Eliminate waste and maximize customer value in processes","Increase inventory buffers","Lengthen development cycles"],a:1,x:"Lean = maximize value, minimize waste (overproduction, waiting, defects, excess inventory, etc.)."},
{d:1,q:"The 'core product' level of a product refers to:",c:["The physical item and its packaging","The fundamental benefit or problem-solving value the customer is really buying","Warranty and after-sales service","The brand name"],a:1,x:"Three levels: core (the underlying benefit), actual (physical good/features/brand/packaging), augmented (services, warranty, support)."},
{d:1,q:"Free installation, warranty, and after-sales support belong to which product level?",c:["Core product","Actual product","Augmented product","Generic product"],a:2,x:"The augmented product adds services and benefits around the actual product."},
{d:1,q:"A 'product line' is:",c:["All products a company sells","A group of closely related products sold by a company (similar function, customers, or channels)","One SKU with multiple prices","The supply chain for one product"],a:1,x:"Product line = related products. Product mix = the complete set of all lines a company offers."},
{d:1,q:"The number of different product lines a company carries is called product mix:",c:["Depth","Width (breadth)","Length","Consistency"],a:1,x:"Width = number of lines; depth = variants within a line; length = total items; consistency = how related lines are."},
{d:1,q:"Adding new variants (sizes, flavors, models) within an existing product line is called:",c:["Line extension","Diversification","Market development","Divestment"],a:0,x:"Line extension deepens an existing line; brand extension takes a brand into a new category."},
{d:1,q:"A PM evaluating whether to license a technology, build in-house, or acquire a company is performing:",c:["A build/buy/partner (sourcing) analysis","A retrospective","Persona development","Win/loss analysis"],a:0,x:"Build vs. buy vs. partner/license is a core PLM sourcing decision the CPM exam expects PMs to assess, including M&A and licensing opportunities."},
{d:1,q:"Which is the BEST reason to reposition rather than retire a declining product?",c:["The team is emotionally attached to it","A viable new segment or use case exists where the product can be competitive","Retirement paperwork is tedious","Competitors still sell similar products"],a:1,x:"Repositioning makes sense only when a real, addressable opportunity exists for the product in a new segment or use."},
{d:1,q:"The 'whole product' concept states that mainstream customers buy:",c:["Only the core technology","The complete solution — product plus services, integrations, and support — needed to fully solve their problem","The cheapest available option","Whatever early adopters buy"],a:1,x:"Mainstream (pragmatist) buyers require the whole product: everything necessary to achieve the buying objective."},
{d:1,q:"Which financial signal MOST strongly suggests a product has entered Decline?",c:["Rising CAC in a growing market","Sustained falling sales and shrinking margins despite maintenance efforts","One bad quarter after a supply issue","High marketing spend at launch"],a:1,x:"Decline is a sustained structural fall in sales/margins, not a one-off dip."},
{d:1,q:"At which ProdBOK phase is the business case FIRST formally developed and approved?",c:["Develop","Plan","Deliver","Retire"],a:1,x:"Conceive generates/screens ideas; Plan builds the business case, market analysis, and product definition for gate approval before Develop."},
{d:1,q:"Beta testing with real customers in their own environment happens primarily in which phase?",c:["Conceive","Plan","Qualify","Retire"],a:2,x:"Qualify covers validation: alpha (internal), beta (external customers), and readiness verification before Launch."},
{d:1,q:"Which launch readiness item is MOST likely to delay a launch gate approval if missing?",c:["A finished sales enablement and support readiness plan","The next product's concept document","A retrospective from a prior sprint","An updated org chart"],a:0,x:"Launch gates verify market/channel/support readiness; missing GTM or support readiness blocks launch."},
{d:1,q:"A cash cow product should generally be:",c:["Divested immediately","Managed for efficiency with minimal investment, using its profits to fund growth products","Given the largest R&D budget","Repositioned into a high-growth market"],a:1,x:"Cash cows are milked: sustain share cheaply and redirect cash to Stars/Question Marks."},
{d:1,q:"True or False: The PLC applies only to physical goods, not services.",c:["True","False"],a:1,x:"False — lifecycle concepts apply to any offering: goods, services, or hybrid solutions, in any industry."},
{d:1,q:"Sales have begun to slow after years of rapid growth and price competition is intensifying. The product is MOST likely transitioning from:",c:["Introduction to Growth","Growth to Maturity","Maturity to Decline","Decline to Withdrawal"],a:1,x:"Slowing growth plus intensifying price competition marks the Growth→Maturity transition."},
{d:1,q:"Which is the PM's PRIMARY lens during the Deliver phase?",c:["Idea screening","Monitoring performance vs. plan (revenue, adoption, support metrics) and optimizing the in-market product","Recruiting the dev team","Designing the logo"],a:1,x:"Deliver is about running and optimizing the launched product against business goals."},
{d:1,q:"An effective product retirement plan should include all EXCEPT:",c:["Migration path for existing customers","Final-order and end-of-support dates","Silent discontinuation with no customer notice","Internal communication and inventory rundown"],a:2,x:"Silent discontinuation damages trust; EOL plans communicate dates, migration, and support wind-down clearly."},
{d:1,q:"Which best describes 'gate deliverables'?",c:["Marketing gifts for customers","The defined outputs of a phase that reviewers evaluate at the gate","Software builds only","Documents produced after launch only"],a:1,x:"Each phase has prescribed deliverables (business case, test results, launch plan, etc.) reviewed at its gate."},
{d:1,q:"Why do many product launches fail even with good products?",c:["Launch timing, channel readiness, and market communication were inadequate","The gate process was followed too carefully","Too much market research was done","Prices were set using value-based methods"],a:0,x:"Execution at launch — timing, channels, positioning, readiness — is a leading cause of failure independent of product quality."},
{d:1,q:"In portfolio reviews, products are commonly evaluated on which two BCG dimensions?",c:["Price and cost","Relative market share and market growth rate","Brand awareness and NPS","Team size and budget"],a:1,x:"BCG plots relative market share vs. market growth to categorize Stars, Cash Cows, Question Marks, Dogs."},
{d:1,q:"A PM is asked to extend a mature product's life. Which set of levers is MOST appropriate?",c:["New uses, new users/segments, more frequent usage, product enhancements","Immediate retirement and archive","Removing all promotion","Raising price 300%"],a:0,x:"Classic maturity-extension levers: find new uses, new users, increase usage frequency, refresh the product."},
{d:1,q:"The MAIN purpose of a launch (GTM) plan is to:",c:["Document engineering architecture","Coordinate positioning, pricing, channels, promotion, sales and support readiness for market entry","Replace the business case","Track sprint velocity"],a:1,x:"GTM plans align all commercial functions for successful market entry."},
{d:1,q:"Which statement about gates is TRUE?",c:["Gates are optional suggestions with no authority","Gate decisions are made by a cross-functional group of decision-makers who control resources","Only engineering attends gates","Gates occur only once, at launch"],a:1,x:"Gatekeepers are cross-functional leaders empowered to commit or withhold resources at each phase transition."},
{d:1,q:"A product generates steady revenue but the market is shrinking 10% annually. Leadership wants maximum cash extraction. The right strategy is:",c:["Invest heavily in R&D","Harvest: cut costs and investment while maintaining sales as long as profitable","Reposition into an adjacent booming market at high cost","Acquire a competitor"],a:1,x:"Harvest maximizes near-term cash from a declining position with minimal investment."},
{d:1,q:"Which ProdBOK phase pairs correctly with its focus?",c:["Conceive — beta testing","Plan — business case and product definition","Qualify — idea generation","Retire — launch marketing"],a:1,x:"Plan produces the business case/definition; Conceive ideates, Qualify validates, Retire ends life."},
{d:1,q:"Which is the BEST example of planned cannibalization?",c:["A competitor stealing your customers","Launching a next-generation product knowing it will replace your current flagship before competitors do it for you","Two sales reps competing for one account","Discounting last year's stock"],a:1,x:"Deliberately obsoleting your own product ('eat your own lunch before someone else does') is strategic cannibalization."},
{d:1,q:"When demand outstrips supply during Growth, the PM's FIRST priority should be:",c:["Raising prices to punish loyal customers","Scaling production/operations and distribution to capture share before competitors","Cutting the marketing budget to zero","Starting the retirement plan"],a:1,x:"Growth rewards whoever captures share; scaling capacity and channels is the priority."},
{d:1,q:"Which role primarily monitors product profitability and internal cost control across the lifecycle?",c:["Product Manager","Scrum Master","QA Manager","PR Manager"],a:0,x:"AIPMM assigns the PdM responsibility for internal value creation — costs, margins, and profit performance."},
{d:1,q:"A 'Hold' gate decision differs from 'No-Go' because Hold:",c:["Terminates the project permanently","Pauses the project (e.g., resources or timing) with intent to revisit, without killing it","Approves the project unconditionally","Requires rework of deliverables"],a:1,x:"Hold = pause and revisit; No-Go = terminate; Recycle = rework and re-present."},
{d:1,q:"Which pair matches the PLC stage to its typical cash flow profile?",c:["Introduction — strongly positive","Growth — improving but investment-hungry","Maturity — negative","Decline — maximum investment"],a:1,x:"Growth has rising revenue but heavy reinvestment; Introduction is negative; Maturity is the cash peak; Decline should minimize investment."},
{d:1,q:"The exam asks how a PM should treat a product with negative contribution margin and no strategic value. Best answer:",c:["Keep it for sentimental reasons","Begin an orderly end-of-life process","Double marketing spend","Rebrand it without changing economics"],a:1,x:"Negative unit economics with no strategic role is the textbook retirement trigger."},
{d:1,q:"True or False: Stage-Gate prescribes concurrent (parallel) cross-functional activities within each stage, not purely sequential work.",c:["True","False"],a:0,x:"True — within stages, activities run in parallel across functions; gates are the sequential control points."},
{d:1,q:"Which document authorizes moving from Plan to Develop in a gated process?",c:["Approved business case at the gate","Press release","Support runbook","Sprint retrospective notes"],a:0,x:"The approved business case (with product definition) is the classic Plan-gate deliverable that unlocks Develop funding."}
);
QB.push(
{d:1,q:"A software product launched 6 months ago has low awareness and slow adoption despite good reviews. The MOST appropriate action is:",c:["Retire the product","Increase awareness-building marketing and evaluate channel effectiveness","Cut the price to zero permanently","Skip to maturity-stage tactics"],a:1,x:"Introduction-stage problems are usually awareness/distribution problems; fix marketing and channels before drastic moves."},
{d:1,q:"Which is a key difference between the PLC (market view) and ProdBOK lifecycle (process view)?",c:["They are identical","PLC describes market sales stages; ProdBOK describes the organization's phases for managing the product from idea to retirement","ProdBOK only covers marketing","PLC only applies to Agile teams"],a:1,x:"PLC = market behavior (Intro/Growth/Maturity/Decline); ProdBOK = internal management process (Conceive→Retire)."},
{d:1,q:"The PRIMARY output of the Conceive phase is:",c:["A validated production product","Screened, prioritized product concepts/ideas worth planning","A launch plan","A support wind-down schedule"],a:1,x:"Conceive generates and screens ideas, producing concepts that justify Plan-phase investment."},
{d:1,q:"Which situation calls for a 'Recycle' rather than 'No-Go'?",c:["The market opportunity has permanently disappeared","Deliverables are promising but incomplete or need rework before a sound decision can be made","The company is exiting the business line","The project violates regulation with no remedy"],a:1,x:"Recycle = promising but needs rework; No-Go = fundamentally not viable."},
{d:1,q:"In lifecycle terms, 'time to market' matters MOST in which situation?",c:["Markets with fast-moving competition and first-mover advantages","Declining markets","Products already retired","Internal tooling with no competition"],a:0,x:"Speed matters most when windows are short and early share capture compounds (Growth-stage dynamics)."},
{d:1,q:"Which metric set would BEST monitor a product in the Deliver phase?",c:["Idea count and concept scores","Revenue vs. plan, adoption, retention/churn, support volume, margin","Prototype defect counts only","Gate meeting attendance"],a:1,x:"Post-launch monitoring tracks commercial and customer health metrics against the business case."},
{d:1,q:"A PM inherits a portfolio: one Star, two Cash Cows, three Dogs. The strategic priority should be:",c:["Fund the Star with Cash Cow profits and evaluate the Dogs for divestment/harvest","Fund all products equally","Kill the Star to protect the Dogs","Sell the Cash Cows first"],a:0,x:"Portfolio logic: milk Cows, feed Stars, fix or exit Dogs."},
{d:1,q:"'Crossing the chasm' requires focusing on:",c:["All segments simultaneously","A specific beachhead niche of pragmatic buyers with a whole-product solution","Only innovators","Cutting product features"],a:1,x:"Moore prescribes dominating a beachhead niche with a complete solution to win the early majority."},
{d:1,q:"Which is TRUE about the relationship between the PLC stage and promotional emphasis?",c:["Introduction emphasizes brand preference; Maturity emphasizes awareness","Introduction builds awareness/trial; Maturity emphasizes differentiation and brand preference","Promotion is identical at all stages","Decline requires maximum promotion"],a:1,x:"Promotion shifts: awareness/trial (Intro) → preference vs. rivals (Growth/Maturity) → minimal (Decline)."},
{d:1,q:"A gate committee approves Develop funding but requires a revised financial model in 60 days. This is an example of:",c:["An unconditional Go","A conditional Go decision","A No-Go","Skipping the gate"],a:1,x:"Conditional Go advances the project with specified conditions to be met."},
{d:1,q:"The MAIN reason companies formalize a product lifecycle process is to:",c:["Create paperwork","Improve decision quality and resource allocation across the funnel, reducing failure rates","Slow down engineering","Satisfy auditors only"],a:1,x:"Formal lifecycle processes exist to invest in the right products and kill weak ones early."},
{d:1,q:"Support costs on an aging product now exceed its gross profit. Customers have a viable migration path. The PM should recommend:",c:["Indefinite support","End-of-life with customer migration plan and support sunset dates","Hiring more support staff","A price freeze"],a:1,x:"When economics are negative and migration exists, orderly EOL is the right recommendation."},
{d:1,q:"During which stage is distribution expansion MOST aggressive?",c:["Introduction","Growth","Decline","Withdrawal"],a:1,x:"Growth is when channels are scaled aggressively to meet expanding demand."},
{d:1,q:"Which lifecycle-related analysis helps decide WHERE to invest across multiple products?",c:["Portfolio analysis (e.g., BCG/GE-McKinsey)","Single-product burndown chart","Sprint retrospective","Unit test coverage"],a:0,x:"Portfolio frameworks compare products to allocate investment rationally."},
{d:1,q:"The GE-McKinsey nine-box matrix evaluates products on:",c:["Market attractiveness and business/competitive strength","Price and promotion","Velocity and quality","NPS and CAC"],a:0,x:"GE-McKinsey generalizes BCG using market attractiveness vs. competitive strength on 3×3 boxes."},
{d:1,q:"Which is a leading indicator that a product is approaching Maturity?",c:["No customers yet","Slowing new-customer growth rate while total sales remain high","Zero competition","Rapidly falling awareness"],a:1,x:"Deceleration of growth while volume stays high signals the top of the curve."},
{d:1,q:"An 'evergreen' subscription product blurs classic PLC stages. What remains true?",c:["Lifecycle thinking no longer applies","Individual features/versions still follow lifecycle stages and require gate-like investment decisions","No retirement decisions are ever needed","Churn is irrelevant"],a:1,x:"Even continuous products manage versions, features, and cohorts through lifecycle-style investment and retirement decisions."},
{d:1,q:"What is the PRIMARY financial purpose of gates as investment checkpoints?",c:["To maximize total spending","To limit exposure by releasing funds incrementally as uncertainty decreases","To guarantee every project launches","To transfer budget to sales"],a:1,x:"Incremental funding caps downside risk on ideas that later prove weak."},
{d:1,q:"Which stakeholder group MUST be included in a launch-gate readiness review?",c:["Only engineering","Cross-functional: marketing, sales, support, operations, finance","Only the CEO","External press"],a:1,x:"Launch readiness spans all commercial functions, so the gate review is cross-functional."},
{d:1,q:"Your new product will make an existing partner's add-on obsolete. Lifecycle-wise, the BEST practice is:",c:["Surprise the partner at launch","Manage ecosystem/channel impacts as part of launch and EOL planning, communicating early","Cancel the product","Let legal handle it after launch"],a:1,x:"Ecosystem and channel impact management is part of responsible lifecycle/launch planning."},
{d:1,q:"Which of the following BEST defines product lifecycle management (PLM) as tested by AIPMM?",c:["A CAD/PDM software category only","Managing a product from conception through retirement with effective, real-world decisions at each phase","Managing only the marketing calendar","Sprint-level task management"],a:1,x:"AIPMM tests PLM as end-to-end decision-making from Conceive to Retire — not the software category."},
{d:1,q:"When should pricing strategy FIRST be considered in the lifecycle?",c:["After launch only","During early planning/business case, since price drives the financial model","Only at maturity","Never — finance owns pricing"],a:1,x:"Price assumptions underpin the business case; pricing is planned early and revisited each stage."},
{d:1,q:"A product in Growth is suffering stockouts while a competitor scales smoothly. The PM's failure was MOST likely in:",c:["Demand forecasting and operations/supply planning","Logo design","Retrospective facilitation","EOL notification"],a:0,x:"Growth-stage execution depends on accurate forecasting and supply/capacity scaling."},
{d:1,q:"Which is TRUE of decline-stage pricing?",c:["Prices always rise","Pricing often becomes tactical — maintaining margin from loyal users or clearing inventory","Value-based pricing is illegal in decline","Price has no role in decline"],a:1,x:"Decline pricing serves harvest goals: margin capture from remaining demand or clearance."},
{d:1,q:"The FIRST formal check that an idea aligns with company strategy happens at:",c:["The initial screening gate after Conceive","Launch","Post-launch review","Retirement"],a:0,x:"Early gates screen for strategic fit before meaningful investment."},
{d:1,q:"Which practice reduces the risk of 'zombie products' (neither growing nor retired)?",c:["Regular portfolio reviews with explicit invest/maintain/harvest/divest decisions","Avoiding all metrics","Permanent budget entitlements per product","Never discussing retirement"],a:0,x:"Scheduled portfolio reviews force explicit lifecycle decisions, preventing drift."},
{d:1,q:"True or False: A successful gate process guarantees product success in the market.",c:["True","False"],a:1,x:"False — gates improve decision quality and reduce risk, but market outcomes are never guaranteed."},
{d:1,q:"What distinguishes 'Deliver' from 'Launch' in ProdBOK?",c:["Nothing — same phase","Launch is the market-entry event/phase; Deliver is the ongoing in-market management afterward","Deliver precedes Launch","Deliver refers to shipping code to QA"],a:1,x:"Launch = entering the market; Deliver = operating, supporting, optimizing the live product."},
{d:1,q:"A key input to the retirement (Retire) gate decision is:",c:["Installed base size, contractual support obligations, and migration options","The color of the next product's packaging","Sprint velocity","Office seating plans"],a:0,x:"Retirement decisions weigh customer/installed-base impact, obligations, and migration feasibility along with economics."},
{d:1,q:"Which sequencing is correct for a typical new product?",c:["Business case → idea screening → launch → development","Idea generation/screening → business case → development → qualification/testing → launch → in-market management → retirement","Launch → development → business case","Testing → idea generation → retirement → launch"],a:1,x:"The canonical funnel runs ideation through retirement in that order."},
{d:1,q:"What role does the product roadmap play in lifecycle management?",c:["It replaces gates","It communicates the planned evolution of the product across lifecycle stages to stakeholders","It is only for investors","It tracks daily tasks"],a:1,x:"Roadmaps are the strategic communication layer over lifecycle plans."},
{d:1,q:"Sales asks why an old product can't just 'stay available forever with no investment.' The PM's BEST lifecycle argument references:",c:["Rising support/maintenance costs, security/compliance risk, and opportunity cost of resources","Personal preference","The age of the codebase alone","Marketing fatigue"],a:0,x:"EOL economics: carrying costs, risk exposure, and opportunity cost justify retirement even if some revenue remains."},
{d:1,q:"Which BEST describes 'stage overlap' risk when teams skip gates to move faster?",c:["No risk exists","Higher rework and wasted investment if later information invalidates earlier assumptions","Guaranteed faster profit","Better compliance"],a:1,x:"Skipping decision checkpoints increases exposure to building on unvalidated assumptions."},
{d:1,q:"The 'installed base' refers to:",c:["Factory equipment","The existing set of customers/units actively using the product","Retired SKUs","Competitor customers"],a:1,x:"Installed base = active users/units in the field — central to EOL and upgrade planning."},
{d:1,q:"For a regulated medical device, which lifecycle characteristic is MOST pronounced?",c:["No documentation needed","Heavier qualification/verification phases and formal gate documentation","No retirement process","Weekly full launches"],a:1,x:"Regulated products amplify Qualify-phase rigor and gate documentation requirements."},
{d:1,q:"Which statement about lifecycle marketing spend is MOST accurate?",c:["Spend as % of revenue is typically highest at Introduction and declines toward Decline","Spend is flat across stages","Decline requires the most spend","Growth requires zero spend"],a:0,x:"Relative marketing intensity is front-loaded to build awareness, then tapers as the product matures and declines."},
{d:1,q:"A conditional launch approval requires monitoring 90-day KPIs. Which post-launch artifact does this create?",c:["A post-launch review against business-case projections","A new MRD","An org redesign","A patent filing"],a:0,x:"Post-launch reviews compare actuals to the business case and inform corrective action."},
{d:1,q:"Which is the BEST example of a lifecycle-driven packaging/pricing move at maturity?",c:["Introducing good/better/best tiers to segment willingness to pay","Removing all price options","Selling only to innovators","Withdrawing from all channels"],a:0,x:"Tiering at maturity extracts more value from segments and defends against low-cost rivals."},
{d:1,q:"The PRIMARY audience for gate review presentations is:",c:["End customers","Executive gatekeepers who control resources","The press","New hires"],a:1,x:"Gate presentations exist to inform resource-controlling decision-makers."}
);
QB.push(
{d:2,q:"Surveys, focus groups, and customer interviews are examples of:",c:["Secondary research","Primary research","Tertiary research","Predictive analytics"],a:1,x:"Primary research collects new data directly from the market; secondary uses existing published sources."},
{d:2,q:"Industry analyst reports and government census data are examples of:",c:["Primary research","Secondary research","Qualitative interviews","Ethnography"],a:1,x:"Secondary research analyzes data someone else already gathered."},
{d:2,q:"Which research approach is BEST for discovering unmet needs you don't yet know exist?",c:["Large-scale quantitative survey","Qualitative methods like ethnography and open-ended interviews","A/B pricing test","Syndicated market-share data"],a:1,x:"Qualitative research explores and discovers; quantitative validates and measures known hypotheses."},
{d:2,q:"A PM wants to validate, with statistical confidence, which of three features customers prefer. Best method:",c:["A quantitative survey (e.g., conjoint or ranked preference) with an adequate sample","Three coffee chats","One focus group","Reading competitor blogs"],a:0,x:"Validation and measurement across a population require quantitative methods with sufficient sample size."},
{d:2,q:"Voice of the Customer (VoC) is:",c:["A call-center technology","A structured process for capturing customer needs, expectations, and preferences","A pricing formula","An agile ceremony"],a:1,x:"VoC systematically gathers and prioritizes customer needs to drive requirements."},
{d:2,q:"Quality Function Deployment (QFD) / House of Quality is used to:",c:["Translate customer requirements into technical/product characteristics","Calculate NPV","Structure a sales territory","Run a retrospective"],a:0,x:"QFD maps customer needs (whats) to engineering characteristics (hows) with priorities."},
{d:2,q:"The Jobs-to-be-Done framework focuses on:",c:["Customer job titles","The outcome or progress a customer is trying to achieve when they 'hire' a product","Employee task lists","Competitor org charts"],a:1,x:"JTBD centers on the outcome customers hire products to accomplish, independent of demographics."},
{d:2,q:"A persona is:",c:["A legally binding customer contract","A research-based archetype representing a target user segment's goals, behaviors, and pain points","A random customer's name","A brand mascot"],a:1,x:"Personas synthesize research into representative user archetypes to guide design and messaging."},
{d:2,q:"Segmenting a market by lifestyle, values, and personality is which type of segmentation?",c:["Geographic","Demographic","Psychographic","Behavioral"],a:2,x:"Psychographic = attitudes, values, lifestyle. Demographic = age/income; behavioral = usage/loyalty."},
{d:2,q:"Segmenting by usage rate, loyalty status, and purchase occasion is:",c:["Behavioral segmentation","Geographic segmentation","Demographic segmentation","Firmographic segmentation"],a:0,x:"Behavioral segmentation divides customers by how they act toward the product."},
{d:2,q:"In B2B, segmenting by industry, company size, and buying process is often called:",c:["Psychographics","Firmographics","Ethnographics","Geodemographics"],a:1,x:"Firmographics are the B2B analog of demographics."},
{d:2,q:"For a segment to be worth targeting, it should be all of the following EXCEPT:",c:["Measurable","Accessible (reachable)","Substantial (large/profitable enough)","Identical to every other segment"],a:3,x:"Good segments are measurable, accessible, substantial, differentiable, and actionable — distinct from other segments, not identical."},
{d:2,q:"Which component does NOT belong in a standard business case?",c:["Problem/opportunity statement","Financial analysis (NPV, ROI, payback)","Risk assessment","Daily standup notes"],a:3,x:"Business cases include executive summary, problem, market/competitive analysis, solution, financials, risks, recommendation — not ceremony notes."},
{d:2,q:"The PRIMARY purpose of a business case is to:",c:["Justify investment and support a go/no-go decision with evidence","Replace the roadmap","Document code architecture","Set sales quotas"],a:0,x:"A business case supports planning and investment decision-making with market and financial justification."},
{d:2,q:"A project requires $1M investment and returns discounted future cash flows of $1.4M. NPV is:",c:["-$400K","$400K","$1.4M","$2.4M"],a:1,x:"NPV = PV of cash flows − initial investment = 1.4M − 1.0M = +$400K → value-creating, proceed."},
{d:2,q:"A project costs $200K and yields net profit of $50K. ROI is:",c:["4%","25%","250%","50%"],a:1,x:"ROI = net profit / investment = 50/200 = 25%."},
{d:2,q:"IRR is defined as:",c:["The discount rate at which NPV equals zero","Total revenue divided by cost","The payback period in years","Gross margin percentage"],a:0,x:"IRR is the discount rate making NPV = 0; projects with IRR above the hurdle rate are attractive."},
{d:2,q:"A product requires $600K upfront and generates $200K net cash per year. The payback period is:",c:["1 year","2 years","3 years","6 years"],a:2,x:"Payback = investment / annual cash = 600/200 = 3 years."},
{d:2,q:"Fixed costs are $500K, price is $100/unit, variable cost is $50/unit. Break-even volume is:",c:["5,000 units","10,000 units","2,500 units","50,000 units"],a:1,x:"Break-even = fixed / (price − variable) = 500,000/50 = 10,000 units."},
{d:2,q:"Which pricing strategy sets price based on what the offering is worth to the customer?",c:["Cost-plus","Value-based","Penetration","Competitive parity"],a:1,x:"Value-based pricing anchors on perceived customer value — preferred for differentiated products."},
{d:2,q:"Cost-plus pricing's main weakness is that it:",c:["Is illegal","Ignores customer willingness to pay and competitive context","Requires knowing customer value","Only works for services"],a:1,x:"Cost-plus guarantees margin math but disconnects price from value and market conditions."},
{d:2,q:"A SaaS company offers a free basic tier and paid premium tiers. This model is:",c:["Skimming","Freemium","Cost-plus","Predatory pricing"],a:1,x:"Freemium = free base product with paid upgrades, common in SaaS."},
{d:2,q:"The 4 Ps of the marketing mix are:",c:["Product, Price, Place, Promotion","People, Process, Physical evidence, Product","Plan, Produce, Promote, Profit","Position, Price, Persona, Pipeline"],a:0,x:"Kotler's 4 Ps: Product, Price, Place (distribution), Promotion."},
{d:2,q:"The extended services marketing mix (7 Ps) adds which three elements?",c:["People, Process, Physical evidence","Profit, Planning, Performance","Positioning, Packaging, PR","Partners, Platforms, Pricing"],a:0,x:"Services add People, Process, and Physical Evidence to the classic 4 Ps."},
{d:2,q:"In the 4 Cs (customer-oriented mix), 'Place' is reframed as:",c:["Cost","Convenience","Communication","Consumer wants"],a:1,x:"4 Cs: Product→Consumer wants/needs, Price→Cost, Place→Convenience, Promotion→Communication."},
{d:2,q:"A service cannot be inventoried for later sale. This characteristic is:",c:["Intangibility","Inseparability","Variability","Perishability"],a:3,x:"Perishability: unused service capacity (empty airline seat, idle consultant hour) is lost forever."},
{d:2,q:"A haircut is produced and consumed at the same time. This is:",c:["Inseparability","Perishability","Intangibility","Homogeneity"],a:0,x:"Inseparability: production and consumption occur simultaneously, often with the customer present."},
{d:2,q:"Service quality differing between providers and even visits by the same provider illustrates:",c:["Perishability","Variability (heterogeneity)","Intangibility","Tangibility"],a:1,x:"Variability: human-delivered services vary person to person and time to time."},
{d:2,q:"A customer cannot inspect a consulting engagement before buying it. This is:",c:["Intangibility","Inseparability","Perishability","Divisibility"],a:0,x:"Intangibility: services cannot be seen, touched, or tried before purchase — raising perceived risk."},
{d:2,q:"Which document captures WHAT the market needs, in the customers' problem language?",c:["PRD","MRD","BRD","SLA"],a:1,x:"The Market Requirements Document captures market/customer needs; the PRD translates them into product capabilities and specs."},
{d:2,q:"Which document defines the product's features and specifications to satisfy market needs?",c:["MRD","PRD","Press release","Win/loss report"],a:1,x:"The Product Requirements Document specifies what the product will do to meet the MRD's needs."},
{d:2,q:"A Business Requirements Document (BRD) primarily captures:",c:["UI colors","Business goals, objectives, and constraints for the initiative","Engineering task estimates","Customer support scripts"],a:1,x:"BRDs frame the business goals and constraints that solutions must satisfy."},
{d:2,q:"Functional specifications describe:",c:["How the business will profit","What the system/product must do — its behaviors and functions","The org structure","Marketing slogans"],a:1,x:"Functional specs define required behaviors; design specs define how they will be implemented."},
{d:2,q:"Which is the correct document flow from market to engineering?",c:["PRD → MRD → design spec","MRD → PRD → functional/design specifications","Design spec → MRD → PRD","BRD → design spec → MRD"],a:1,x:"Needs (MRD) drive product definition (PRD), which drives functional and design specifications."},
{d:2,q:"The AMA-style definition of marketing research emphasizes:",c:["Guessing based on intuition","Systematically linking the consumer to the marketer through information used to identify opportunities, evaluate actions, and monitor performance","Only measuring advertising","Replacing strategy"],a:1,x:"Marketing research is the systematic gathering, recording, and analysis of data to inform marketing decisions."},
{d:2,q:"The distinction between 'market research' and 'marketing research' is that market research:",c:["Is concerned specifically with markets, while marketing research covers marketing processes broadly","Is always qualitative","Is done only by agencies","Is illegal in the EU"],a:0,x:"Experts distinguish market research (about markets) from marketing research (about the full marketing process)."},
{d:2,q:"Which sampling problem occurs when survey respondents differ systematically from the target population?",c:["Sampling/selection bias","Perfect randomization","Conjoint analysis","Regression to the mean"],a:0,x:"Selection bias undermines generalizability — e.g., surveying only power users about ease of use."},
{d:2,q:"A focus group is BEST used to:",c:["Produce statistically projectable results","Explore attitudes, language, and reactions in a moderated group discussion","Replace beta testing","Set final pricing"],a:1,x:"Focus groups are qualitative and exploratory; they don't produce projectable quantitative results."},
{d:2,q:"Observing users in their natural environment to understand behavior in context is:",c:["Ethnographic research","Telephone survey","Syndicated panel","Delphi method"],a:0,x:"Ethnography observes real usage in context, revealing needs users may not articulate."},
{d:2,q:"Win/loss analysis involves:",c:["Interviewing/analyzing why deals were won or lost to improve product and positioning","Counting sports scores","Auditing finance ledgers","Ranking employees"],a:0,x:"Win/loss analysis mines sales outcomes for product, pricing, and positioning insight."},
{d:2,q:"Which financial concept represents revenue minus variable costs?",c:["Gross margin","Contribution margin","Net income","EBITDA"],a:1,x:"Contribution margin = revenue − variable costs; it 'contributes' to covering fixed costs and profit."},
{d:2,q:"Gross margin is calculated as:",c:["(Revenue − COGS) / Revenue","Revenue / COGS","Fixed costs / unit price","Net profit / investment"],a:0,x:"Gross margin % = (Revenue − COGS) ÷ Revenue."},
{d:2,q:"When comparing projects of different sizes and durations, which metric combination is MOST informative?",c:["NPV together with IRR and payback period","Payback period alone","Revenue alone","Headcount"],a:0,x:"NPV shows absolute value creation; IRR shows efficiency; payback shows liquidity/risk — together they inform the decision."},
{d:2,q:"A positive-NPV project should still be rejected if:",c:["It has any risk at all","It conflicts with strategy or exceeds available resources/risk tolerance versus better alternatives","The NPV is greater than zero","Marketing likes it"],a:1,x:"NPV is necessary but not sufficient — strategic fit, capacity, and opportunity cost matter."},
{d:2,q:"Which roadmap type organizes around customer/business outcomes rather than specific features?",c:["Outcome (or theme) roadmap","Gantt chart","Feature-date roadmap","Org chart"],a:0,x:"Outcome/theme roadmaps commit to goals rather than dated feature lists, preserving flexibility."},
{d:2,q:"The MAIN risk of sharing a detailed, dated feature roadmap externally is:",c:["It's too short","Creating commitments that constrain the team when plans change","Customers ignore it","It cannot be printed"],a:1,x:"External dated roadmaps become de facto promises; slips damage credibility and can create legal exposure."},
{d:2,q:"A go-to-market (GTM) strategy defines:",c:["How the product will reach and win its target market — segments, positioning, channels, pricing, and launch approach","Server architecture","The hiring plan for HR","Board meeting cadence"],a:0,x:"GTM covers target market, value proposition/positioning, channels, pricing, and launch motion."},
{d:2,q:"Which research method BEST tests real willingness to pay?",c:["Asking 'would you pay $50?' casually","Behavioral methods like conjoint analysis, price testing, or actual pre-sales","Counting social media likes","Employee polls"],a:1,x:"Stated intent overestimates; conjoint and real purchase tests reveal actual willingness to pay."},
{d:2,q:"Customer requirements gathered in VoC should be:",c:["Immediately converted into solutions without prioritization","Prioritized (e.g., by importance/satisfaction) and traced through to requirements","Ignored if inconvenient","Kept secret from engineering"],a:1,x:"Needs are prioritized and traced into requirements documents so investment follows importance."},
{d:2,q:"Which is a SECONDARY research source for competitive analysis?",c:["Your own customer interviews","Competitor annual reports, analyst coverage, and public filings","A usability test you run","Your beta telemetry"],a:1,x:"Public/competitor-published materials are secondary sources; your own studies are primary."},
{d:2,q:"An executive summary in a business case should:",c:["Be written last and concisely state the opportunity, solution, financials, and recommendation","List every requirement","Contain only legal disclaimers","Be longer than the body"],a:0,x:"The executive summary distills the whole case for decision-makers — typically drafted after the analysis is complete."},
{d:2,q:"Which qualitative-then-quantitative sequence is BEST practice?",c:["Quant first to discover, qual to validate","Qual to discover and frame hypotheses, then quant to validate and size them","Only qual ever","Only quant ever"],a:1,x:"Discover with qualitative, then validate/measure with quantitative — the standard research sequence."},
{d:2,q:"A survey question that suggests its own answer ('Don't you agree our award-winning product is easy to use?') is:",c:["A leading (biased) question","A screening question","A Likert item","A conjoint task"],a:0,x:"Leading questions bias responses and corrupt findings; neutral wording is required."},
{d:2,q:"Risk assessment in a business case should include:",c:["Only technical risks","Market, technical, financial, and execution risks with mitigation plans","No risks, to keep approval likely","Only competitor names"],a:1,x:"Credible cases enumerate key risk categories and mitigations."},
{d:2,q:"Which metric pair BEST supports a pricing decision for a new product?",c:["Customer value perception and competitive price benchmarks","Office rent and utilities","Sprint velocity and bug count","Employee NPS"],a:0,x:"Price is set primarily on customer value, bounded by competition and cost floors."},
{d:2,q:"'Product mix consistency' refers to:",c:["How closely related the various product lines are in use, production, or channels","The number of SKUs","Profit margin uniformity","Packaging colors"],a:0,x:"Consistency describes how related lines are — affecting brand coherence and operational synergy."},
{d:2,q:"Which document typically contains acceptance criteria for individual capabilities in agile settings?",c:["User stories (with acceptance criteria)","The press kit","The EOL notice","The BCG matrix"],a:0,x:"Agile requirements live in user stories with acceptance criteria — the fine-grained analog of spec documents."},
{d:2,q:"When market research budget is near zero, the PM's BEST first move is:",c:["Skip research entirely","Leverage secondary research and internal data (support tickets, sales notes, telemetry) before commissioning studies","Buy the most expensive panel","Guess"],a:1,x:"Free/cheap secondary and internal sources answer many questions and sharpen any later primary research."},
{d:2,q:"A pilot or test market launch is used to:",c:["Delay the product indefinitely","Validate demand, messaging, and operations in a limited market before full rollout","Replace the business case","Avoid making pricing decisions"],a:1,x:"Test markets de-risk full launch by validating the mix in a contained real-world setting."}
);
QB.push(
{d:3,q:"A PM must align engineering, sales, and finance on a new initiative but has no direct authority over any of them. This is BEST described as:",c:["A failure of organizational design","Influence without authority — a core PM competency","A matrix problem requiring CEO escalation","The Project Manager's job"],a:1,x:"Influence without authority is the defining PM leadership skill."},
{d:3,q:"Which McKinsey 7S element concerns the values and beliefs guiding employee behavior?",c:["Strategy","Structure","Style","Shared Values"],a:3,x:"Shared Values sit at the center of the 7S model as the organization's guiding beliefs."},
{d:3,q:"The 'hard' elements of McKinsey 7S are:",c:["Strategy, Structure, Systems","Skills, Staff, Style","Shared Values, Skills, Staff","Strategy, Staff, Style"],a:0,x:"Hard S's: Strategy, Structure, Systems. Soft S's: Skills, Staff, Style, Shared Values."},
{d:3,q:"McKinsey 7S is MOST useful for:",c:["Calculating NPV","Examining organizational alignment, especially during change","Setting product prices","Writing user stories"],a:1,x:"7S diagnoses whether the seven organizational elements are aligned — commonly used in change management."},
{d:3,q:"In a functional organization, a key weakness for product management is:",c:["Too much product ownership","Limited product ownership; cross-functional conflicts resolved mainly through discussion/escalation","Excessive duplication of product resources","Too much customer focus"],a:1,x:"Functional structures give strong functional depth but weak end-to-end product accountability."},
{d:3,q:"A product-centric organization's main drawback is:",c:["No product focus","Potential duplication of resources across product teams","No clear ownership","Weak product knowledge"],a:1,x:"Product structures create clear ownership but can duplicate functions (marketing, ops) per product."},
{d:3,q:"An organization structured around Market A, Market B, and Market C customers is a:",c:["Functional organization","Market/customer organization","Matrix organization","Holacracy"],a:1,x:"Market-based structures organize around customer segments — strong customer focus, weaker product authority."},
{d:3,q:"In a matrix organization, product managers:",c:["Have direct authority over all functions","Coordinate across departments without direct authority, creating high coordination demands","Report only to engineering","Do not exist"],a:1,x:"Matrix = dual reporting lines; PMs coordinate laterally, which raises influence and conflict-management demands."},
{d:3,q:"Which team member acts as the 'voice of the customer' evaluating customer perception of value?",c:["Product Manager (PdM)","Product Marketing Manager (PmM)","QA Manager","Development Manager"],a:1,x:"AIPMM: the PmM represents the customer's voice and outbound value perception; the PdM drives internal value creation."},
{d:3,q:"Which team member owns schedule, scope, and cost for the development effort?",c:["Project Manager","Product Manager","Sales Manager","Support Manager"],a:0,x:"The Project Manager manages the triple constraint; the Product Manager owns the what and why."},
{d:3,q:"Requirements elicitation and documentation is the specialty of the:",c:["Business Analyst","PR Manager","Scrum Master","CFO"],a:0,x:"Business Analysts elicit, analyze, and document requirements on the core team."},
{d:3,q:"In SWOT, 'Opportunities' and 'Threats' are:",c:["Internal factors","External factors","Financial metrics","Personality traits"],a:1,x:"Strengths/Weaknesses are internal; Opportunities/Threats are external."},
{d:3,q:"A resource constraint like an understaffed data science team appears in SWOT as a:",c:["Strength","Weakness","Opportunity","Threat"],a:1,x:"Internal gaps and constraints are Weaknesses."},
{d:3,q:"New regulation that could restrict your product category is a SWOT:",c:["Strength","Weakness","Opportunity","Threat"],a:3,x:"External unfavorable forces are Threats."},
{d:3,q:"The FIRST step of stakeholder management is:",c:["Sending a newsletter","Identifying stakeholders early and mapping their influence and interest","Scheduling a launch party","Escalating to the CEO"],a:1,x:"Identify → categorize by influence/interest → tailor communication plans."},
{d:3,q:"High-influence, high-interest stakeholders should be:",c:["Ignored","Managed closely with frequent, tailored engagement","Only emailed annually","Removed from the project"],a:1,x:"The influence/interest grid: manage closely (high/high), keep satisfied, keep informed, monitor."},
{d:3,q:"Calling the PM the product's 'internal CEO' means:",c:["The PM can fire anyone","The PM takes end-to-end ownership and aligns stakeholders around product success without formal authority","The PM sets company-wide salaries","The PM reports to no one"],a:1,x:"The metaphor describes broad accountability and cross-functional alignment responsibility, not formal power."},
{d:3,q:"Two functional leads deadlock over launch priorities. The PM's BEST first move is:",c:["Escalate immediately to the CEO","Facilitate a decision using shared goals, data, and documented trade-offs","Pick sides based on friendship","Delay the launch indefinitely"],a:1,x:"PMs resolve conflict first through facilitation, shared objectives, and evidence; escalation is a later resort."},
{d:3,q:"Which behavior BEST builds a PM's influence capital across functions?",c:["Hoarding information","Consistently delivering on commitments and communicating transparently","Taking credit for others' work","Bypassing all managers"],a:1,x:"Trust from reliability and transparency is the currency of influence without authority."},
{d:3,q:"An effective roadmap review meeting should:",c:["Present decisions as unchangeable and skip questions","Align stakeholders on priorities, surface concerns, and record decisions and trade-offs","Exclude sales","Focus only on engineering tasks"],a:1,x:"Roadmap reviews exist to create alignment and make trade-offs explicit."},
{d:3,q:"A newly formed cross-functional team is arguing over ways of working. Per Tuckman's model, this stage is:",c:["Forming","Storming","Norming","Performing"],a:1,x:"Tuckman: Forming → Storming (conflict) → Norming → Performing → Adjourning."},
{d:3,q:"During which Tuckman stage does the team establish shared norms and settle roles?",c:["Forming","Storming","Norming","Adjourning"],a:2,x:"Norming is when conflict resolves into agreed working practices before high-output Performing."},
{d:3,q:"Which communication practice BEST serves distributed cross-functional teams?",c:["Relying on hallway conversations","Documented decisions, clear owners, and regular structured communication cadences","One annual meeting","Private verbal agreements"],a:1,x:"Distributed alignment requires written decisions and predictable communication rhythms."},
{d:3,q:"When executives keep overriding product priorities ad hoc, the PM's BEST structural remedy is:",c:["Quit","Establish an agreed prioritization framework and decision rights (e.g., gate/portfolio process)","Hide the roadmap","Comply silently each time"],a:1,x:"Codified decision criteria and forums convert ad-hoc power into governed decisions."},
{d:3,q:"The RACI model is used to:",c:["Estimate market size","Clarify who is Responsible, Accountable, Consulted, and Informed for activities","Compute IRR","Design packaging"],a:1,x:"RACI charts prevent ownership confusion across cross-functional work."},
{d:3,q:"In RACI, exactly one person should hold which role per deliverable?",c:["Responsible","Accountable","Consulted","Informed"],a:1,x:"Single-point accountability: one Accountable owner per deliverable; multiple people can be Responsible."},
{d:3,q:"A PmM and PdM disagree: PmM wants launch messaging simplified; PdM worries about accuracy. Best resolution:",c:["PdM pulls rank","Test messaging with target customers and align on evidence","Flip a coin","Skip messaging entirely"],a:1,x:"Customer evidence resolves internal opinion conflicts — a recurring AIPMM theme."},
{d:3,q:"Which is a sign of a healthy core product team?",c:["Functions attend gates unprepared","Clear shared goals, defined roles, and open debate followed by commitment","Decisions made only in private","Sales excluded from launch planning"],a:1,x:"Healthy teams share goals, know their roles, and commit after honest debate."},
{d:3,q:"'Managing up' for a PM primarily means:",c:["Flattering executives","Keeping leadership informed with the right altitude of information and framing decisions they need to make","Delegating your work to your boss","Withholding bad news"],a:1,x:"Managing up = proactive, decision-oriented communication with leadership."},
{d:3,q:"Organizational change initiatives fail MOST often because:",c:["Logos change too fast","Soft factors — culture, buy-in, communication — are neglected","Too much attention to people","Spreadsheets are hard"],a:1,x:"7S insight: hard-factor changes fail without aligning soft factors like shared values and skills."},
{d:3,q:"Which structure gives a PM the STRONGEST direct authority over product decisions?",c:["Functional","Product-centric","Market-based","None — even product-centric PMs coordinate through influence"],a:1,x:"Product organizations concentrate product ownership under the PM, though influence still matters everywhere."},
{d:3,q:"A stakeholder communication plan should vary by:",c:["Stakeholder influence, interest, and information needs","Alphabetical order","Office location only","Salary band"],a:0,x:"Tailor frequency, channel, and content to each stakeholder category."},
{d:3,q:"The BEST way to gain engineering's trust as a PM is to:",c:["Promise customers whatever they ask","Bring validated customer problems and clear priorities, and respect technical trade-offs","Change priorities daily","Skip technical discussions"],a:1,x:"Engineers trust PMs who bring real problems, stable priorities, and informed trade-off discussions."},
{d:3,q:"When a launch requires support, sales, marketing, and ops readiness, the PM should:",c:["Assume each function will figure it out","Drive a cross-functional launch plan with owners, dates, and readiness criteria","Do every function's job personally","Delay informing support until launch day"],a:1,x:"PMs orchestrate readiness through explicit cross-functional planning — influence in action."},
{d:3,q:"Which soft skill is MOST critical when the PM must deliver a 'No-Go' recommendation on a project the sponsor loves?",c:["Data-backed candor with empathy and a clear rationale","Avoidance","Sarcasm","Anonymous feedback"],a:0,x:"Difficult messages require evidence, directness, and empathy — key PM leadership behaviors."},
{d:3,q:"Consensus-building in cross-functional teams works BEST when the PM:",c:["Frames decisions around shared goals and objective criteria agreed in advance","Lets the loudest voice win","Makes all decisions secretly","Defers every decision upward"],a:0,x:"Pre-agreed criteria and shared goals depersonalize decisions and enable commitment."},
{d:3,q:"Which is TRUE about the PdM/PmM split in AIPMM's model?",c:["PdM = outbound only","PdM directs internal value creation; PmM evaluates and communicates customer-perceived value","PmM writes code","They are always the same person by rule"],a:1,x:"PdM = inbound/internal value; PmM = outbound/customer value. One person may wear both hats, but the functions differ."},
{d:3,q:"A core team member consistently misses gate deliverables. The PM should FIRST:",c:["Publicly shame them","Address it directly with the member, understand blockers, and agree on a recovery plan","Escalate to HR immediately","Remove the gate"],a:1,x:"Direct, private problem-solving precedes escalation."},
{d:3,q:"Team incentives that reward only functional metrics (e.g., sales volume regardless of margin) create:",c:["Perfect alignment","Misalignment with product/portfolio goals that the PM must surface and address","Faster gates","Better documentation"],a:1,x:"Incentive misalignment is an organizational issue PMs must recognize and raise."},
{d:3,q:"'Escalation' is used correctly when:",c:["Used first, for every disagreement","Reserved for decisions beyond the team's authority or unresolved after good-faith attempts, presented with options","Used to punish colleagues","Avoided even when a decision is blocked for months"],a:1,x:"Escalate deliberately: after facilitation fails or when authority is genuinely lacking — and bring options, not just problems."},
{d:3,q:"Which practice MOST improves cross-functional gate meetings?",c:["Distributing deliverables and criteria in advance so decisions, not readings, happen in the meeting","No agendas","Inviting the whole company","Deciding before reviewing evidence"],a:0,x:"Pre-reads plus clear criteria make gates decision forums rather than status theater."},
{d:3,q:"A PM discovers sales is promising unbuilt features to close deals. Best response:",c:["Ignore it","Align with sales leadership on roadmap communication rules and provide approved collateral","Publicly blame reps","Build whatever was promised"],a:1,x:"Fix the system: agreed communication guardrails and enablement materials."},
{d:3,q:"Which factor is a 'soft' element in 7S?",c:["Systems","Structure","Style","Strategy"],a:2,x:"Style (leadership/management style) is soft, along with Skills, Staff, Shared Values."},
{d:3,q:"The PRIMARY purpose of a core cross-functional product team is to:",c:["Reduce meeting invitations","Bring all functions needed for product success into shared planning and decisions across the lifecycle","Replace the executive team","Isolate engineering from customers"],a:1,x:"Core teams institutionalize cross-functional ownership of the product across its lifecycle."}
);
QB.push(
{d:4,q:"In Scrum, who is responsible for prioritizing the product backlog?",c:["Scrum Master","Development Team","Product Owner","Stakeholders"],a:2,x:"The Product Owner owns and orders the backlog to maximize value."},
{d:4,q:"A well-written user story follows the format:",c:["'The system shall [function] when [condition]'","'As a [user type], I want [goal], so that [benefit]'","'Feature: [name] | Priority | Effort'","'Given [context], when [action], then [result]'"],a:1,x:"That's the user story template; 'Given/When/Then' (option D) is Gherkin acceptance-criteria format."},
{d:4,q:"Waterfall development is BEST suited to:",c:["Rapidly changing consumer software","Stable requirements, regulatory environments, and hardware products","Products with unknown users","Startups pivoting weekly"],a:1,x:"Waterfall's sequential phases fit stable, well-specified, regulated, or hardware contexts."},
{d:4,q:"Waterfall's PRIMARY weakness is:",c:["Too many releases","Inflexibility when requirements change after early phases","Excessive customer feedback","Too little documentation"],a:1,x:"Late-discovered changes are expensive because each phase depends on frozen upstream outputs."},
