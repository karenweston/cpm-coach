{d:4,q:"The correct Waterfall phase order is:",c:["Design → Requirements → Test → Development","Requirements → Design → Development → Test → Deploy → Maintain","Development → Requirements → Deploy → Design","Test → Design → Requirements → Deploy"],a:1,x:"Waterfall flows sequentially from requirements through maintenance."},
{d:4,q:"Agile development is characterized by:",c:["A single big-bang release","Iterative, incremental delivery with continuous feedback in short cycles","No customer involvement","Sequential frozen phases"],a:1,x:"Agile delivers value in short iterations with ongoing customer feedback and adaptation."},
{d:4,q:"A typical Scrum sprint length is:",c:["1 day","2 weeks (1–4 weeks)","6 months","1 year"],a:1,x:"Sprints are time-boxed iterations, commonly two weeks, never more than about a month."},
{d:4,q:"Which is a Scrum ceremony?",c:["Gate review","Sprint Retrospective","Annual audit","Board meeting"],a:1,x:"Scrum ceremonies: Sprint Planning, Daily Standup, Sprint Review, Sprint Retrospective."},
{d:4,q:"The Sprint Review differs from the Retrospective in that the Review:",c:["Inspects the product increment with stakeholders; the Retrospective inspects the team's process","Is only for HR","Happens before the sprint starts","Replaces testing"],a:0,x:"Review = product feedback; Retrospective = process improvement."},
{d:4,q:"The Scrum Master's role is to:",c:["Prioritize the backlog","Facilitate the process, remove impediments, and coach the team","Manage the P&L","Write all the code"],a:1,x:"The Scrum Master is a servant-leader for process health — not the backlog owner or people manager."},
{d:4,q:"A burndown chart shows:",c:["Revenue by region","Remaining work versus time in a sprint or release","Employee attrition","Server temperatures"],a:1,x:"Burndown tracks remaining effort against the time box, exposing schedule risk early."},
{d:4,q:"Story points measure:",c:["Exact hours","Relative size/complexity of work items","Lines of code","Team happiness"],a:1,x:"Points are relative estimates of effort/complexity/uncertainty, not absolute time."},
{d:4,q:"Kanban primarily manages flow by:",c:["Time-boxed sprints","Visualizing work and limiting work in progress (WIP)","Annual planning","Gates"],a:1,x:"Kanban = visualize workflow, limit WIP, optimize flow — no required sprints."},
{d:4,q:"In Stage-Gate vs. Agile comparisons, Agile is generally:",c:["Better for large capital-intensive physical products","More flexible, best for software and fast-changing markets, with just-in-time documentation","Heavier on upfront documentation","Slower to respond to change"],a:1,x:"Agile trades upfront documentation for adaptability; Stage-Gate suits big-bet physical products."},
{d:4,q:"True or False: Stage-Gate and Agile can be combined — e.g., Agile development inside the Develop stage of a gated process.",c:["True","False"],a:0,x:"True — hybrid models use gates for investment decisions and Agile for execution between gates."},
{d:4,q:"An MVP (Minimum Viable Product) is:",c:["The cheapest possible product regardless of value","The smallest version that delivers value and enables validated learning","A prototype never shown to users","The final release"],a:1,x:"MVPs test critical assumptions with real users at minimal cost — a Lean Startup core concept."},
{d:4,q:"The Lean Startup loop is:",c:["Plan-Do-Check-Act","Build-Measure-Learn","Conceive-Plan-Develop","Define-Measure-Analyze"],a:1,x:"Build → Measure → Learn drives iterative validation of assumptions."},
{d:4,q:"A 'pivot' in Lean Startup means:",c:["Firing the team","A structured change in strategy based on validated learning, keeping what works","Abandoning all learning","Raising prices"],a:1,x:"Pivots redirect strategy (segment, problem, channel) based on evidence while retaining validated elements."},
{d:4,q:"Technology Readiness Levels (TRL) run from:",c:["1 (basic research) to 9 (fully deployed/proven system)","0 to 100","A to F","1 to 3"],a:0,x:"TRL 1–9 assesses technology maturity before committing to development."},
{d:4,q:"A technology at TRL 3 (proof of concept) implies:",c:["Ready for mass production","Significant development risk remains before productization","No further testing needed","It is already launched"],a:1,x:"Low TRL = early maturity = high technical risk to retire before committing product plans."},
{d:4,q:"Acceptance criteria define:",c:["The marketing budget","The conditions under which a story/feature is considered done and acceptable","The org chart","Sprint length"],a:1,x:"Acceptance criteria make 'done' objective and testable for each story."},
{d:4,q:"In Scrum, the Product Owner role maps MOST closely to which broader role?",c:["The product manager (or a delegate) focused on backlog value decisions","The CFO","The Scrum Master","A QA engineer"],a:0,x:"The PO is the value-decision role; in many orgs the PdM or a delegate fills it. PdMs influence beyond the backlog."},
{d:4,q:"Which situation argues for Waterfall over Agile?",c:["A web app with weekly user feedback","Firmware for an aircraft component with fixed certification requirements","A/B-tested landing pages","An experimental social app"],a:1,x:"Fixed, certifiable, safety-critical requirements favor plan-driven approaches."},
{d:4,q:"The Daily Standup exists to:",c:["Report to executives","Synchronize the team on progress, plans, and impediments in a short time-box","Review the budget","Demo to customers"],a:1,x:"Standups are quick team synchronization — not status reporting to management."},
{d:4,q:"'Definition of Done' differs from acceptance criteria because it:",c:["Applies to a single story only","Is a shared quality standard applying to ALL increments (tested, documented, deployable)","Is written by customers","Changes per story"],a:1,x:"DoD is the team-wide quality bar; acceptance criteria are story-specific."},
{d:4,q:"Concurrent engineering in NPD means:",c:["Sequential handoffs only","Overlapping design, engineering, and manufacturing work in parallel to cut cycle time","Outsourcing everything","Testing after launch only"],a:1,x:"Parallel cross-functional work shortens time to market versus strict sequential handoffs."},
{d:4,q:"Which artifact is the single ordered source of work for a Scrum team?",c:["The Product Backlog","The Gantt chart","The MRD","The org chart"],a:0,x:"The Product Backlog is the ordered list of everything that might be needed in the product."},
{d:4,q:"A sprint backlog is:",c:["All work for the year","The set of backlog items selected for the current sprint plus the plan to deliver them","A list of bugs only","The roadmap"],a:1,x:"Sprint backlog = sprint goal items + delivery plan, owned by the developers."},
{d:4,q:"Prototypes are used in NPD primarily to:",c:["Decorate the office","Reduce risk by testing concepts, usability, and feasibility before full investment","Replace market research entirely","Meet legal requirements only"],a:1,x:"Prototypes test assumptions cheaply — from paper mockups to functional models."},
{d:4,q:"Velocity in Scrum is:",c:["A contractual commitment","The team's average completed story points per sprint, used for forecasting","A measure of code quality","Set by management"],a:1,x:"Velocity is an empirical planning aid, not a target or commitment imposed from outside."}
);
QB.push(
{d:5,q:"According to Porter's Five Forces, which force applies when customers can easily switch to an alternative product meeting the same need?",c:["Bargaining Power of Buyers","Threat of New Entrants","Threat of Substitutes","Competitive Rivalry"],a:2,x:"Substitutes are different products fulfilling the same underlying need (e.g., video calls substituting for air travel)."},
{d:5,q:"A company enters a new geographic market with its existing product line. Per the Ansoff Matrix this is:",c:["Product Development","Diversification","Market Penetration","Market Development"],a:3,x:"Market Development = existing product, new market. Penetration = existing/existing; Product Dev = new product/existing market; Diversification = new/new."},
{d:5,q:"Selling more of an existing product to existing customers (e.g., via promotions) is:",c:["Market Penetration","Market Development","Product Development","Diversification"],a:0,x:"Penetration grows share in current markets with current products — the lowest-risk Ansoff quadrant."},
{d:5,q:"Launching a brand-new product into a brand-new market is:",c:["Penetration","Diversification","Market Development","Product Development"],a:1,x:"Diversification (new product + new market) is the highest-risk growth strategy."},
{d:5,q:"Which Five Force is MOST at play when two dominant suppliers control a critical component's price?",c:["Buyer power","Supplier power","Substitutes","New entrants"],a:1,x:"Concentrated suppliers of critical inputs wield high bargaining power."},
{d:5,q:"Low barriers to entry in an industry primarily increase which force?",c:["Threat of New Entrants","Supplier power","Buyer power","Substitutes"],a:0,x:"Easy entry (low capital, no regulation, weak brand loyalty) raises the threat of new entrants."},
{d:5,q:"PESTLE analysis covers:",c:["Political, Economic, Social, Technological, Legal, Environmental factors","Price, Earnings, Sales, Taxes, Labor, Equity","Product, Engineering, Strategy, Testing, Launch, EOL","People, Empathy, Systems, Trust, Leadership, Ethics"],a:0,x:"PESTLE assesses macro-environmental forces shaping strategy."},
{d:5,q:"A new data-privacy law affecting your product would appear in PESTLE under:",c:["Social","Legal","Environmental","Economic"],a:1,x:"Regulation and legislation are Legal factors (Political covers government stability/policy direction)."},
{d:5,q:"Porter's three generic competitive strategies are:",c:["Cost leadership, differentiation, focus","Growth, hold, harvest","Penetration, skimming, freemium","Inbound, outbound, hybrid"],a:0,x:"Compete on lowest cost, unique value, or narrow-segment focus — and avoid being 'stuck in the middle.'"},
{d:5,q:"A boutique firm serving only left-handed golfers exceptionally well pursues which strategy?",c:["Cost leadership","Differentiation (broad)","Focus (niche)","Diversification"],a:2,x:"Focus targets a narrow segment with tailored value."},
{d:5,q:"Blue Ocean Strategy advocates:",c:["Fighting for share in existing crowded markets","Creating uncontested market space through value innovation — differentiation AND low cost simultaneously","Only cutting prices","Copying the market leader"],a:1,x:"Blue Ocean = make competition irrelevant via value innovation, versus bloody 'red oceans.'"},
{d:5,q:"The standard positioning statement template is:",c:["'For [target], [product] is the [category] that [key benefit] because [reason to believe]'","'We sell [product] cheaply'","'As a [user], I want [goal]'","'Given [context], when [action], then [result]'"],a:0,x:"Positioning statements define target, frame of reference, differentiation, and proof."},
{d:5,q:"A perceptual map is used to:",c:["Visualize how customers perceive brands/products on key dimensions relative to competitors","Track sprint progress","Model cash flows","Diagram the org"],a:0,x:"Perceptual maps (e.g., price vs. quality axes) reveal positioning gaps and opportunities."},

const CONCEPTS = {
1: {title:"Product Lifecycle Management", weight:"~40% of exam — your #1 priority", html:`
<h3>The two lifecycles (don't confuse them)</h3>
<p><b>Market PLC (what the market does):</b> Introduction → Growth → Maturity → Decline (→ Withdrawal). <b>ProdBOK process (what YOU do):</b> Conceive → Plan → Develop → Qualify → Launch → Deliver → Retire — each phase preceded by a cross-functional <b>gate</b>.</p>
<h3>Stage characteristics & PM actions</h3>
<p><b>Introduction:</b> low sales, high cost, few competitors → build awareness, set up distribution, choose pricing (penetration = low to grab share; skimming = high for early adopters, drop later). Highest marketing spend relative to revenue.<br>
<b>Growth:</b> rapid sales, competitors flood in, profits rise → scale production, expand distribution aggressively, refine positioning. Forecasting/supply failures here cost you the market.<br>
<b>Maturity:</b> sales peak/plateau, heaviest competition, profits peak early then erode → differentiate, cut costs, segment, tier pricing, find new uses/users/usage. Watch for commoditization.<br>
<b>Decline:</b> falling sales → choose: <b>harvest</b> (cut investment, milk cash), <b>divest</b> (sell), <b>reposition</b> (new segment), or <b>retire</b>.</p>
<h3>Gates (heavily tested)</h3>
<p>Decisions: <b>Go / No-Go / Hold / Recycle</b>. Go = proceed with resources. No-Go = kill. Hold = pause, revisit. Recycle = rework deliverables, re-present. Gates are <b>investment control checkpoints</b> — funding increases incrementally as uncertainty falls. Gatekeepers = cross-functional leaders who control resources. Criteria: strategic alignment, market attractiveness, technical feasibility, financial return. Early gates do <b>screening</b> (many ideas → viable few).</p>
<h3>Portfolio management</h3>
<p>BCG (relative market share × market growth): <b>Star</b> (high/high — invest), <b>Cash Cow</b> (high share/low growth — milk to fund others), <b>Question Mark</b> (low share/high growth — invest or divest), <b>Dog</b> (low/low — harvest/divest). GE-McKinsey generalizes to market attractiveness × competitive strength. Portfolio decisions: invest / maintain / harvest / divest.</p>
<h3>Roles & concepts</h3>
<p><b>Inbound PM</b> = the "radar": research, competitive intel, requirements, strategy. <b>Outbound</b> = GTM, sales training, advertising, PR. PdM owns Conceive→Launch and internal value creation (costs, profit). Adoption curve: Innovators → Early Adopters → <b>[CHASM]</b> → Early Majority → Late Majority → Laggards; cross the chasm with a beachhead niche + <b>whole product</b>. <b>Cannibalization</b> can be strategic (replace your own product before competitors do). <b>EOL:</b> notify customers, migration path, support wind-down dates, archive docs — never silent.</p>
<p class="trap">⚠ Traps: profits peak in MATURITY (not growth); marketing spend ratio highest in INTRODUCTION; Recycle ≠ No-Go; PLC ≠ ProdBOK phases; harvest ≠ retire.</p>`},
2: {title:"Marketing Research, Business Plans & Documentation", weight:"~20-25% of exam", html:`
<h3>Research</h3>
<p><b>Primary</b> = new data you collect (surveys, interviews, focus groups, ethnography, usability tests). <b>Secondary</b> = existing sources (analyst reports, gov data, competitor filings). <b>Qualitative</b> discovers & explores (small n, focus groups, ethnography); <b>quantitative</b> validates & measures (large n, surveys, conjoint). Sequence: qual first to frame, quant to validate. Watch for <b>selection bias</b> and <b>leading questions</b>. Willingness-to-pay: use behavioral methods (conjoint, real price tests), not "would you pay?"</p>
<h3>Understanding customers</h3>
<p><b>VoC</b> = structured capture of customer needs. <b>QFD/House of Quality</b> translates needs → technical characteristics. <b>JTBD</b> = the outcome the customer "hires" the product for. <b>Personas</b> = research-based archetypes. Good segments are measurable, accessible, substantial, differentiable, actionable. Segmentation types: geographic, demographic, psychographic (values/lifestyle), behavioral (usage/loyalty); B2B = firmographics.</p>
<h3>Business case & finance (do the math cold)</h3>
<p>Components: exec summary, problem/opportunity, market & competitive analysis, solution, financials, risks, recommendation.<br>
<b>NPV</b> = PV of future cash flows − investment; positive → proceed. <b>ROI</b> = net profit ÷ investment. <b>IRR</b> = discount rate where NPV = 0. <b>Payback</b> = investment ÷ annual cash flow. <b>Break-even units</b> = fixed costs ÷ (price − variable cost). Contribution margin = revenue − variable costs. Gross margin = (revenue − COGS) ÷ revenue.</p>
<h3>Pricing & marketing mix</h3>
<p>Cost-plus (ignores value), value-based (preferred for differentiated), competitive, penetration (low→share), skimming (high→drop), freemium. <b>4 Ps:</b> Product, Price, Place, Promotion. <b>7 Ps (services):</b> + People, Process, Physical Evidence. <b>4 Cs:</b> Consumer wants, Cost, Convenience, Communication.</p>
<h3>Services & documents</h3>
<p>Service characteristics: <b>Intangibility</b> (can't inspect first), <b>Inseparability</b> (produced = consumed), <b>Variability</b> (quality varies), <b>Perishability</b> (can't inventory).<br>
Document flow: <b>MRD</b> (market needs) → <b>PRD</b> (product specs) → functional/design specifications. <b>BRD</b> = business goals/constraints. Roadmap types: feature, theme, outcome — dated external roadmaps become promises.</p>
<p class="trap">⚠ Traps: MRD = WHAT market needs, PRD = WHAT product does; perishability vs. intangibility; positive NPV is necessary but not sufficient (strategy still rules).</p>`},
3: {title:"Teams, People & Organizational Issues", weight:"~15% of exam", html:`
<h3>Org structures</h3>
<p><b>Functional:</b> simple, strong functional depth, weak product ownership. <b>Product-centric:</b> clear ownership, risk of duplicated resources. <b>Market/customer:</b> strong customer focus, PM lacks full product authority. <b>Matrix:</b> functional + product combined; coordination without authority, high conflict potential.</p>
<h3>Core team & roles</h3>
<p><b>PdM</b> — investigates, selects, drives development; internal value creation (cost/profit). <b>PmM</b> — voice of the customer; customer-perceived value. <b>Project Manager</b> — schedule, scope, cost. <b>Business Analyst</b> — requirements. Plus dev, QA, support, sales managers. PM = "internal CEO": end-to-end accountability WITHOUT formal authority. <b>Influence without authority</b> is THE core PM competency — built via reliability, transparency, evidence.</p>
<h3>Frameworks</h3>
<p><b>McKinsey 7S</b> (org alignment/change): Hard = Strategy, Structure, Systems. Soft = Skills, Staff, Style, <b>Shared Values</b> (center of model). Change fails when soft factors are ignored.<br>
<b>SWOT:</b> Strengths/Weaknesses = internal; Opportunities/Threats = external.<br>
<b>RACI:</b> Responsible, Accountable (exactly ONE per deliverable), Consulted, Informed.<br>
<b>Tuckman:</b> Forming → Storming (conflict) → Norming (norms set) → Performing → Adjourning.</p>
<h3>Stakeholders & conflict</h3>
<p>Identify early → map influence × interest → tailor communication (high/high = manage closely). Conflict: facilitate first with shared goals + data; escalate deliberately with options, not just problems. Resolve internal opinion battles with customer evidence.</p>
<p class="trap">⚠ Traps: Style is a SOFT S (Shared Values ≠ Style); O and T in SWOT are EXTERNAL; one Accountable per deliverable; matrix ≠ product-centric.</p>`},
4: {title:"New Product Development Methodology", weight:"~10% of exam", html:`
<h3>Waterfall vs. Agile</h3>
<p><b>Waterfall:</b> Requirements → Design → Development → Test → Deploy → Maintain. Best for stable requirements, regulated/safety-critical, hardware. Weakness: inflexible to change.<br>
<b>Agile:</b> iterative sprints (1–4 wks, typically 2), continuous feedback, self-organizing cross-functional teams, just-enough documentation. Best for software and fast-changing markets. <b>Hybrids are valid:</b> Agile execution inside Stage-Gate investment gates.</p>
<h3>Scrum (memorize the trios)</h3>
<p><b>Roles:</b> Product Owner (owns/prioritizes backlog — the value decisions), Scrum Master (facilitates, removes impediments — NOT the boss), Development Team.<br>
<b>Artifacts:</b> Product Backlog (single ordered work source), Sprint Backlog, Increment. Burndown chart = remaining work vs. time. Velocity = avg completed points/sprint (forecasting aid, not a commitment).<br>
<b>Ceremonies:</b> Sprint Planning, Daily Standup (team sync, not status reporting), Sprint Review (inspect PRODUCT with stakeholders), Retrospective (inspect PROCESS).</p>
<h3>Requirements & learning</h3>
<p>User story: "As a [user], I want [goal], so that [benefit]." Acceptance criteria (often Given/When/Then) define done per story; <b>Definition of Done</b> = team-wide quality bar. Story points = relative complexity. <b>Kanban:</b> visualize flow, limit WIP, no required sprints.<br>
<b>MVP</b> = smallest version that delivers value + enables validated learning. Lean Startup loop: <b>Build → Measure → Learn</b>; pivot = evidence-based strategy change. <b>TRL</b> 1 (basic research) → 9 (proven in operation). Concurrent engineering = parallel cross-functional work to cut cycle time.</p>
<p class="trap">⚠ Traps: PO ≠ Scrum Master; Review (product) ≠ Retrospective (process); user story format ≠ Gherkin; velocity is not a contract.</p>`},
5: {title:"Strategy", weight:"~10% of exam", html:`
<h3>Analysis toolkit (know which tool for which scope)</h3>
<p><b>PESTLE</b> = macro-environment: Political, Economic, Social, Technological, Legal, Environmental. <b>Porter's 5 Forces</b> = industry structure: Rivalry, New Entrants, Substitutes, Buyer Power, Supplier Power. <b>SWOT</b> = integrated internal + external synthesis. Sequence: vision/mission → external + internal analysis → options → selection → execution & monitoring.</p>
<h3>Growth & competition</h3>
<p><b>Ansoff:</b> Penetration (existing/existing — lowest risk), Market Development (existing product/new market), Product Development (new product/existing market), Diversification (new/new — highest risk).<br>
<b>Porter's generic strategies:</b> Cost Leadership, Differentiation, Focus — commit or be "stuck in the middle." Differentiation only works if customers value it, perceive it, and it resists copying.<br>
<b>Blue Ocean:</b> create uncontested space via value innovation (differentiation AND low cost); ERRC grid: Eliminate, Reduce, Raise, Create. First-mover advantage endures only with lock-in (network effects, switching costs).</p>
<h3>Positioning</h3>
<p>Template: "For [target customer], [Product] is the [category] that [key benefit] because [reason to believe]." Perceptual maps plot perception vs. competitors to find gaps. Product strategy cascades FROM business strategy; roadmaps organized by themes/outcomes connect strategy to execution. Core competencies = valuable, rare, hard-to-imitate capabilities.</p>
<p class="trap">⚠ Traps: substitutes (different product, same need) ≠ rivalry (same product); Legal ≠ Political in PESTLE; Market Dev = new MARKET, Product Dev = new PRODUCT.</p>`},
6: {title:"Tools & Measurements", weight:"~5% of exam — quick wins", html:`
<h3>Customer & growth metrics</h3>
<p><b>NPS</b> = %Promoters(9–10) − %Detractors(0–6); passives excluded. <b>CAC</b> = sales+marketing spend ÷ new customers. <b>LTV/CLV</b> = lifetime customer value; healthy LTV:CAC ≈ 3:1+. <b>Churn</b> = % customers/revenue lost per period. <b>DAU/MAU</b> = stickiness/engagement. Feature adoption = % using a capability.</p>
<h3>Market sizing</h3>
<p><b>TAM</b> (total opportunity) ⊃ <b>SAM</b> (portion you can serve) ⊃ <b>SOM</b> (realistic near-term share). Market share = your sales ÷ total market sales.</p>
<h3>Business model & competitive tools</h3>
<p>Business model = how an org <b>creates, delivers, and captures value</b> (describe/classify businesses, explore opportunities). <b>Business Model Canvas — 9 blocks:</b> Customer Segments, Value Propositions, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships, Cost Structure.<br>
Competitive tools: feature comparison matrices, win/loss analysis, battlecards (sales-facing competitor playbooks).</p>
<h3>Finance recap</h3>
<p>NPV positive → proceed. IRR = rate where NPV=0. Payback = investment ÷ annual cash. Contribution margin = revenue − variable costs. Gross margin = (revenue − COGS) ÷ revenue.</p>
<p class="trap">⚠ Traps: NPS passives (7–8) count in the denominator but not the formula's subtraction; SAM ≠ SOM; Canvas has NINE blocks.</p>`}

const ESSAYS=[
{d:1,q:"Your company's flagship product has entered the Decline stage. Describe the four strategic options available and explain how you would decide among them.",
pts:["Names all four options: harvest, divest, reposition, retire","Harvest = cut investment, maximize remaining cash flow","Divest = sell the product/line to another party","Reposition = re-invest to target a new segment or use case","Retire = orderly end-of-life with customer notification and migration","Decision criteria: profitability/contribution margin, strategic fit, installed base obligations, existence of a viable new segment"],
model:"In Decline there are four options. Harvest: reduce investment to a minimum and collect remaining profits while sales last. Divest: sell the product to a buyer who values it more. Reposition: re-invest to serve a new segment or use case where the product can compete. Retire: withdraw via an orderly end-of-life process with customer notification, migration paths, and support wind-down. I would decide based on the product's contribution margin and trajectory, strategic alignment with company direction, the size and contractual obligations of the installed base, and whether evidence supports a genuinely viable repositioning opportunity. If margins are positive but the market is structurally shrinking, harvest; if a credible buyer exists, divest; if research validates a new segment, reposition; otherwise retire responsibly."},
{d:1,q:"Explain the purpose of gates in a Stage-Gate process and describe the four possible gate decisions.",
pts:["Gates are investment control checkpoints between phases","Cross-functional decision-makers who control resources make the call","Resource commitment increases incrementally as uncertainty falls","Go = proceed to next phase with committed resources","No-Go = terminate; Hold = pause and revisit; Recycle = rework deliverables and re-present","Gate criteria: strategic alignment, market attractiveness, technical feasibility, financial return"],
model:"Gates are cross-functional investment control checkpoints placed before each lifecycle phase. Their purpose is to release funding incrementally: as a project passes each gate, uncertainty has been reduced, so the organization can rationally commit more resources while capping downside risk on weak ideas. Gatekeepers are leaders who control resources, evaluating prescribed deliverables against criteria such as strategic alignment, market attractiveness, technical feasibility, and financial return. Four decisions are possible: Go (advance with resources committed), No-Go (terminate the project), Hold (pause without killing it, e.g., for timing or resources), and Recycle (send the team back to rework deliverables before re-presenting). Early gates also perform screening — narrowing many ideas to a viable few."},
{d:1,q:"A competitor has launched a low-priced clone of your mature, differentiated product. Describe how you would respond, referencing lifecycle stage and competitive strategy.",
pts:["Recognizes maturity-stage dynamics: peak competition, commoditization pressure","Avoids reflexive price war — defends the differentiation position","Reinforce and communicate value/differentiators customers care about","Segment: consider tiered offerings (good/better/best) or a flanker product for price-sensitive segments","Manage costs to protect margin","Monitor with win/loss analysis and adjust"],
model:"A low-cost clone at maturity is classic commoditization pressure. I would not lead with a price war — that concedes my differentiation advantage and may be unwinnable against a lower-cost rival. Instead I would first re-validate which differentiators customers actually value, and sharpen positioning and sales tools (battlecards, win/loss analysis) around them. Second, I would segment the response: keep the flagship differentiated at premium price, while considering a lower-priced tier or flanker offering to protect price-sensitive segments without eroding the core brand. Third, I would pursue cost reduction to preserve margin flexibility. Finally, I would monitor share, win/loss reasons, and churn to adjust — escalating to product enhancements if the clone closes the value gap."},
{d:1,q:"Explain the difference between the market Product Life Cycle and the ProdBOK product lifecycle phases, and why a product manager needs both.",
pts:["PLC = market behavior: Introduction, Growth, Maturity, Decline","ProdBOK = organizational process: Conceive, Plan, Develop, Qualify, Launch, Deliver, Retire","PLC describes what the market does; ProdBOK describes what the organization does","Gates precede each ProdBOK phase","PM needs both: PLC to choose market strategy per stage; ProdBOK to manage internal decisions and investment"],
model:"The market PLC — Introduction, Growth, Maturity, Decline — describes how sales, competition, and profits behave in the market over time. The ProdBOK lifecycle — Conceive, Plan, Develop, Qualify, Launch, Deliver, Retire — describes the phases through which an organization manages a product, each preceded by a cross-functional gate. They answer different questions: the PLC tells the PM what strategy the market context demands (build awareness in Introduction, scale in Growth, differentiate and cut costs in Maturity, harvest or exit in Decline), while ProdBOK governs internal decision-making and incremental investment from idea through retirement. A PM needs both lenses simultaneously: ProdBOK to run the process, the PLC to choose the right strategy inside it."},
{d:1,q:"Describe a responsible end-of-life (EOL) process for a product with a large installed customer base.",
pts:["Decision justified by criteria: declining sales, negative margins, strategic misalignment","Early, clear customer notification with dates (end of sale, end of support)","Migration path to replacement product or alternative","Phased support wind-down honoring contractual obligations","Internal coordination: sales, support, channel, inventory rundown","Documentation archiving and lessons learned"],
model:"First, validate the retirement decision against explicit criteria — sustained decline, negative contribution margin, or strategic misalignment — and get gate approval. Then plan around the installed base: announce early with unambiguous milestones (end-of-sale, end-of-maintenance, end-of-support dates), honoring all contractual commitments. Provide a migration path — a successor product, upgrade incentives, or validated third-party alternatives — and support customers through the transition. Coordinate internally: prepare support and sales with talking points, run down inventory, notify channel partners, and manage final orders. Finally, archive documentation and capture lessons learned. The goals are protecting customer trust and brand reputation while ending unprofitable investment in an orderly way — never a silent discontinuation."},
{d:1,q:"Your CEO asks why the company should keep funding a low-growth product with high market share instead of putting everything into new products. Answer using portfolio management concepts.",
pts:["Identifies the product as a BCG Cash Cow (high share, low growth)","Cash cows fund Stars and Question Marks — the growth engine's financing","Balanced portfolio needs products at different lifecycle stages","Manage the cow for efficiency: minimal investment, maximize cash","Cutting it entirely risks share collapse and loses the funding source"],
model:"That product is our Cash Cow: high share in a low-growth market. In portfolio terms, cash cows are the financing engine of the portfolio — their profits fund the Stars we're scaling and the Question Marks we're betting on. A balanced portfolio deliberately holds products at different lifecycle stages so mature products pay for the pipeline. The right move isn't defunding it entirely — that invites share erosion and kills the cash stream — but managing it for efficiency: minimal defensive investment, cost discipline, and price/packaging optimization, with the surplus explicitly redirected to growth products. I'd formalize that through regular portfolio reviews with invest/maintain/harvest/divest decisions per product."},
{d:2,q:"Explain the difference between primary and secondary research, and between qualitative and quantitative methods. Describe when a PM should use each.",
pts:["Primary = new data collected directly (surveys, interviews, focus groups, ethnography)","Secondary = existing sources (analyst reports, government data, filings)","Qualitative = small-n discovery and insight; quantitative = large-n validation and measurement","Best-practice sequence: secondary first (cheap), then qual to discover, then quant to validate/size","Match method to decision: discovery vs. measurement"],
model:"Primary research collects new data directly from the market — surveys, interviews, focus groups, ethnography, usability tests. Secondary research uses data that already exists: analyst reports, government statistics, competitor filings. Qualitative methods (interviews, ethnography) use small samples to discover needs, language, and context; quantitative methods (surveys, conjoint) use large samples to validate and measure with statistical confidence. A PM should sequence them: start with secondary research because it's fast and cheap and frames the problem; use qualitative research to discover unmet needs and generate hypotheses; then use quantitative research to validate those hypotheses and size them. The choice always follows the decision at hand — exploration demands qualitative; commitment of resources demands quantitative validation."},
{d:2,q:"You must build the business case for a new product. List its key components and explain the role of NPV, ROI, and payback period in the recommendation.",
pts:["Components: executive summary, problem/opportunity, market analysis, competitive analysis, proposed solution, financial analysis, risk assessment, recommendation","NPV = PV of future cash flows minus investment; positive NPV creates value","ROI = net profit ÷ investment; efficiency of capital","Payback = time to recoup investment; liquidity/risk lens","Financials are necessary but not sufficient — strategic fit and risk still matter"],
model:"A business case contains an executive summary, problem/opportunity statement, market analysis, competitive analysis, the proposed solution, financial analysis, risk assessment with mitigations, and a recommendation. The financial trio each answers a different question. NPV discounts projected cash flows and subtracts the investment: positive NPV means the product creates value in absolute terms, making it the primary go/no-go signal. ROI (net profit over investment) expresses capital efficiency, useful for comparing projects of different sizes. Payback period shows how quickly the investment is recovered — a liquidity and risk measure attractive when the future is uncertain. I would present all three, because a positive-NPV project can still be wrong if it misfits strategy, exceeds risk tolerance, or crowds out better alternatives."},
{d:2,q:"Explain the four characteristics that distinguish services from physical goods, with an example of how each affects product management decisions.",
pts:["Intangibility — can't inspect before purchase → reduce perceived risk (trials, testimonials, tangible cues)","Inseparability — produced and consumed simultaneously → provider/customer experience design matters","Variability/heterogeneity — quality varies by person and time → training, standards, process control","Perishability — capacity can't be inventoried → demand management, pricing (off-peak), capacity planning"],
model:"Services differ from goods in four ways. Intangibility: customers can't see or try the service beforehand, so PMs must reduce perceived risk with trials, guarantees, testimonials, and tangible evidence. Inseparability: the service is produced and consumed simultaneously, often with the customer present, so the delivery experience and provider interaction are part of the product design itself. Variability: quality differs across providers and occasions, so PMs invest in training, standardization, scripts, and quality processes to narrow the spread. Perishability: unused capacity — an empty seat, an idle consultant hour — is lost forever, so PMs manage demand with reservations, off-peak pricing, and capacity planning. Together these push service PMs toward the extended 7P mix, adding People, Process, and Physical Evidence."},
{d:2,q:"Describe the purpose of the MRD and the PRD, how they relate, and what goes wrong when teams skip the MRD.",
pts:["MRD captures market/customer needs in problem language","PRD translates needs into product features and specifications","Flow: MRD → PRD → functional/design specs","Skipping MRD → solution built on assumptions; features without validated needs","Traceability: every requirement should trace to a market need"],
model:"The Market Requirements Document captures what the market needs — customer problems, segments, and priorities, written in the customer's problem language. The Product Requirements Document translates those needs into what the product will do: features, capabilities, and specifications, which then drive functional and design specs. The MRD answers 'what problem, for whom, and why it matters'; the PRD answers 'what we will build to solve it.' When teams skip the MRD, the PRD becomes a feature list grounded in internal assumptions rather than validated needs — the classic cause of well-engineered products nobody buys. Requirements lose traceability, prioritization becomes opinion-driven, and marketing later struggles to position a product that was never anchored to a market problem."},
{d:3,q:"Product managers are often described as needing 'influence without authority.' Explain what this means and describe three concrete ways a PM builds it.",
pts:["PM is accountable for product success but doesn't manage the contributing functions","'Internal CEO' metaphor — end-to-end ownership without formal power","Build trust through reliability: deliver on commitments, transparent communication","Use evidence: customer data and research to depersonalize decisions","Shared goals / agreed prioritization criteria and decision forums (RACI, gates)"],
model:"PMs are accountable for a product's success but hold no formal authority over the engineers, marketers, salespeople, and support staff whose work determines it — hence the 'internal CEO' metaphor: full ownership, no direct reports. Influence must substitute for authority. Three ways to build it: first, reliability — consistently delivering on commitments and communicating transparently, which compounds into trust. Second, evidence — bringing validated customer data and research to decisions, so debates resolve on facts rather than rank or volume. Third, shared structure — establishing agreed goals, prioritization criteria, and decision rights (RACI charts, gate forums) in advance, so decisions are governed by criteria everyone endorsed rather than ad-hoc power. Escalation stays available, but as a deliberate last resort presented with options."},
{d:3,q:"Compare the four organizational structures for product management and name the primary weakness of each.",
pts:["Functional: strong functional depth; weak product ownership, conflicts resolved by discussion/escalation","Product-centric: clear ownership; duplicated resources across product teams","Market/customer-based: strong customer focus; PM lacks full product authority","Matrix: combines functional + product; coordination without authority, high conflict potential"],
model:"Functional organizations group people by discipline (engineering, marketing); they build deep functional skill cheaply, but no one truly owns the product end-to-end, and cross-functional conflicts resolve only through discussion or escalation. Product-centric organizations give the PM full responsibility for specific products — clear ownership and focus — but risk duplicating functions across product teams. Market or customer organizations align around segments, producing strong customer knowledge across the product line, but the PM lacks full authority over product decisions. Matrix organizations overlay product coordination on functional reporting: flexible and resource-efficient, but they demand constant coordination without authority, creating high potential for conflict and slow decisions. Most PMs operate in some matrix variant, which is why influence skills are core to the role."},
{d:3,q:"Your launch requires readiness from sales, support, marketing, and operations. Describe how you would organize and govern that cross-functional effort.",
pts:["Cross-functional launch plan with explicit readiness criteria per function","RACI: one Accountable owner per workstream","Stakeholder mapping and tailored communication cadence","Launch gate review verifying readiness before go","Risk tracking and escalation path with options"],
model:"I would run launch as a governed cross-functional program. First, build a launch plan that defines readiness criteria per function — sales trained and equipped, support staffed with runbooks, marketing assets and channels live, operations able to fulfill. Second, assign RACI for every workstream with exactly one Accountable owner each, so nothing falls between functions. Third, map stakeholders by influence and interest and set a communication cadence — weekly readiness reviews with a visible dashboard. Fourth, treat the launch gate as a real decision: cross-functional leaders verify readiness evidence before Go, with Hold or Recycle available if criteria aren't met. Finally, maintain a risk log with owners and an escalation path, escalating deliberately with options rather than problems."},
{d:4,q:"Compare Waterfall and Agile development. When is each appropriate, and how can Stage-Gate and Agile coexist?",
pts:["Waterfall: sequential phases, heavy upfront documentation; best for stable requirements, regulated, hardware","Weakness: inflexible to changing requirements","Agile: iterative sprints, continuous feedback, just-enough documentation; best for software/fast-changing markets","Hybrid: gates govern investment decisions; Agile runs execution inside stages (e.g., Develop)"],
model:"Waterfall proceeds sequentially — requirements, design, development, test, deploy — freezing each phase before the next. It suits stable requirements, regulated or safety-critical domains, and hardware where late change is prohibitively expensive; its weakness is inflexibility when requirements evolve. Agile delivers iteratively in short sprints with continuous customer feedback, self-organizing cross-functional teams, and just-in-time documentation; it suits software and fast-moving markets, trading upfront predictability for adaptability. They are not mutually exclusive: a common hybrid keeps Stage-Gate as the investment governance layer — gates still decide whether to fund the next phase — while the Develop stage internally runs Agile sprints. The business controls risk through gates; the team retains iteration speed between them."},
{d:4,q:"Explain the MVP concept and the Build-Measure-Learn loop, including what a 'pivot' is.",
pts:["MVP = smallest version that delivers value and enables validated learning","Purpose: test riskiest assumptions before full investment","Build-Measure-Learn: build MVP → measure real behavior → learn/decide","Pivot = structured strategy change based on validated learning, retaining what works","Contrast with 'launch big and hope'"],
model:"A Minimum Viable Product is the smallest version of a product that delivers real value and generates validated learning about the riskiest assumptions — demand, willingness to pay, usage behavior — before full investment. It anchors the Lean Startup Build-Measure-Learn loop: build the MVP, measure how real users actually behave (not what they say), and learn whether the underlying hypothesis held. The loop then repeats: persevere and extend if validated, or pivot if not. A pivot is a structured change in strategy — a new customer segment, problem, channel, or revenue model — that retains the validated elements while abandoning the invalidated ones. The discipline replaces 'build everything and hope' with incremental, evidence-based commitment, philosophically similar to what gates do at larger scale."},
{d:5,q:"Use Porter's Five Forces to explain why an attractive-looking market might still be unprofitable to enter.",
pts:["Names the five forces: rivalry, new entrants, substitutes, buyer power, supplier power","High rivalry erodes margins through price competition","Low entry barriers mean success attracts copycats","Substitutes cap prices even without direct competitors","Powerful buyers or suppliers capture the value the market creates"],
model:"Market size and growth say nothing about who captures the value — industry structure does. Porter's Five Forces explain why: intense competitive rivalry drives price wars that erode everyone's margins. Weak barriers to entry mean any early profits attract new entrants who compete them away. Substitutes — different products serving the same need — cap what customers will pay even where direct competition is thin. Powerful buyers (concentrated, price-sensitive, low switching costs) negotiate margins down, and powerful suppliers (few sources of a critical input) negotiate costs up. A large, growing market with low entry barriers, strong substitutes, and concentrated buyers can therefore be structurally unprofitable, while a smaller market with favorable forces yields durable returns. Entry analysis must assess structure, not just size."},
{d:5,q:"Explain the Ansoff Matrix and rank its four strategies by risk, with an example of each.",
pts:["Axes: existing/new products × existing/new markets","Market Penetration (existing/existing) — lowest risk — e.g., promotions to grow share","Market Development (existing product/new market) — e.g., geographic expansion","Product Development (new product/existing market) — e.g., new offering for current customers","Diversification (new/new) — highest risk — e.g., entering an unrelated business","Risk rises with each new dimension of unfamiliarity"],
model:"The Ansoff Matrix maps growth strategies on two axes: products (existing vs. new) and markets (existing vs. new). Market Penetration — existing products in existing markets — is lowest risk: win share through promotion, pricing, or usage frequency, like a streaming service converting free users. Market Development takes existing products to new markets, such as expanding a proven SaaS product to Europe; risk comes from unfamiliar customers and channels. Product Development creates new products for existing markets — a bank launching insurance to current customers; risk lies in new-product execution. Diversification — new products for new markets, like a retailer entering cloud computing — is highest risk because both dimensions are unfamiliar. Risk rises with each dimension of newness, so evidence requirements and gate scrutiny should rise correspondingly."},
{d:6,q:"Your executive team asks how you'll measure post-launch product health. Propose a metric set and justify each choice.",
pts:["Adoption/activation — is the market actually taking it up (feature adoption, DAU/MAU)","Retention/churn — is delivered value sustained","NPS or satisfaction — customer sentiment/loyalty","Commercial: revenue vs. business-case plan, gross margin, CAC vs. LTV (target ~3:1)","Compare actuals to business-case projections — post-launch review discipline"],
model:"I would track four layers. Adoption: new customer/user growth and activation, plus DAU/MAU for engagement — proof the market is actually taking the product up. Retention: churn and retention rates, because keeping customers proves sustained value delivery and drives lifetime economics. Sentiment: NPS (promoters minus detractors) as a loyalty leading indicator, supplemented by support volume trends. Commercial health: revenue against the business-case projection, gross margin, and unit economics — CAC versus LTV with roughly a 3:1 LTV:CAC target — so growth is efficient, not bought. Every metric is compared to the business case we got funded on, through scheduled post-launch reviews; that closes the loop between the promises made at the gates and the product's real performance, and triggers corrective action early."}

const DOMS={1:["Product Lifecycle Management",40],2:["Marketing Research, Business Plans & Docs",20],3:["Teams, People & Org Issues",15],4:["NPD Methodology",10],5:["Strategy",10],6:["Tools & Measurements",5]};
const MOD_MIX={1:12,2:6,3:5,4:3,5:3,6:1};      // 30-question module
const FULL_MIX={1:48,2:24,3:18,4:12,5:12,6:6}; // 120-question exam
const PASS=74;
const LETTERS=["A","B","C","D"];

/* ---------- persistent progress ---------- */
let P;
try{P=JSON.parse(localStorage.getItem("cpmCoachV1"))||{}}catch(e){P={}}
P.q=P.q||{}; P.f=P.f||{}; P.exams=P.exams||[]; P.e=P.e||{};
function save(){try{localStorage.setItem("cpmCoachV1",JSON.stringify(P))}catch(e){}}
function qs(i){return P.q[i]||(P.q[i]={s:0,r:0,w:0})}
function record(i,correct){const s=qs(i);s.s++;correct?s.r++:s.w++;s.last=Date.now();save();}
function exportProgress(){
  const blob=new Blob([JSON.stringify(P,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="cpm_coach_progress_"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importProgress(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.q&&!j.f&&!j.exams)throw 0;localStorage.setItem("cpmCoachV1",JSON.stringify(j));location.reload()}catch(e){alert("That file doesn't look like a CPM Coach progress backup.")}};
  r.readAsText(f);
}
function domStats(d){let seen=0,r=0,w=0,total=0;QB.forEach((q,i)=>{if(q.d!==d)return;total++;const s=P.q[i];if(s&&s.s){seen++;r+=s.r;w+=s.w}});return{seen,total,r,w,acc:(r+w)?r/(r+w):null}}
function readiness(){let num=0,den=0;for(const d in DOMS){const st=domStats(+d);if(st.acc===null)continue;const cov=Math.min(1,st.seen/Math.max(6,st.total*0.3));num+=DOMS[d][1]*st.acc*cov;den+=DOMS[d][1]}return den?num/den*100:null}

/* ---------- voice ---------- */
let voiceOut=false,voiceIn=false,rec=null,listening=false,voiceCtx=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleVoice(which){
  if(which==="out"){voiceOut=!voiceOut;if(!voiceOut)speechSynthesis.cancel();}
  else{
    if(!SR&&!voiceIn){alert("Voice input isn't supported in this browser. Chrome, Edge, or Safari work best.");return}
    voiceIn=!voiceIn;
    if(voiceIn&&!voiceOut){voiceOut=true}
    if(voiceIn)startListening();else stopListening();
  }
  document.getElementById("togOut").classList.toggle("on",voiceOut);
  document.getElementById("togIn").classList.toggle("on",voiceIn);
}
function speak(text,cb){
  if(!voiceOut){cb&&cb();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=1.04;u.onend=()=>cb&&cb();u.onerror=()=>cb&&cb();
  speechSynthesis.speak(u);
}
function micUI(live,msg){const m=document.getElementById("mic");if(!m)return;m.classList.toggle("live",live);m.querySelector("span").textContent=msg||(live?"Listening… say A, B, C, or D":"Mic idle");}
function startListening(){
  if(!SR||!voiceIn||listening)return;
  rec=new SR();rec.lang="en-US";rec.continuous=false;rec.interimResults=false;
  rec.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase().trim();handleVoice(t)};
  rec.onend=()=>{listening=false;micUI(false);if(voiceIn)setTimeout(()=>{if(voiceIn&&!listening)startListening()},350)};
  rec.onerror=e=>{listening=false;if(e.error==="not-allowed"){voiceIn=false;document.getElementById("togIn").classList.remove("on");micUI(false,"Mic blocked — allow microphone access and try again")}};
  try{rec.start();listening=true;micUI(true)}catch(e){listening=false}
}
function stopListening(){if(rec){try{rec.onend=null;rec.stop()}catch(e){}}listening=false;micUI(false,"Voice answers off")}
function parseChoice(t,n){
  const words=" "+t.replace(/[^a-z0-9 ]/g," ")+" ";
  const map=[[" a "," ay "," option a "," answer a "," one "," 1 "],[" b "," be "," bee "," option b "," answer b "," two "," 2 "],[" c "," see "," sea "," option c "," answer c "," three "," 3 "],[" d "," dee "," option d "," answer d "," four "," 4 "]];
  for(let i=0;i<Math.min(4,n);i++){if(map[i].some(k=>words.includes(k)))return i}
  if(n===2){if(words.includes(" true "))return 0;if(words.includes(" false "))return 1}
  return -1;
}
function handleVoice(t){
  if(!S)return;
  if(/\b(repeat|again|say that again)\b/.test(t)){readCurrent();return}
  if(S.phase==="feedback"){
    if(/\b(next|continue|go on|okay|ok)\b/.test(t)){nextQ();return}
    if(/\b(explain|why)\b/.test(t)){const q=QB[S.list[S.i]];speak(q.x);return}
  }
  if(S.phase==="question"){
    if(/\b(skip|pass)\b/.test(t)&&S.mode==="exam"){answer(-1);return}
    const c=parseChoice(t,QB[S.list[S.i]].c.length);
    if(c>=0){pick(c);return}
    micUI(listening,'Heard "'+t+'" — say A, B, C, or D');
  }
}

/* ---------- session engine ---------- */
let S=null,timerInt=null;
function startSession(o){
  S={mode:o.mode,list:o.list,i:0,answers:[],phase:"question",secs:o.secs||0,label:o.label};
  if(timerInt)clearInterval(timerInt);
  if(S.secs>0){timerInt=setInterval(()=>{S.secs--;const t=document.getElementById("tmr");if(t){t.textContent=fmt(S.secs);t.classList.toggle("low",S.secs<180)}if(S.secs<=0){clearInterval(timerInt);finishSession(true)}},1000)}
  renderQ();
}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderQ(){
  const gi=S.list[S.i],q=QB[gi];
  let perm=q.c.map((_,ci)=>ci);
  const isTF=q.c.length===2&&q.c[0]==="True";
  if(!isTF)shuffle(perm);            // shuffle answer positions every render
  S.perm=perm;
  const opts=perm.map((oi,ci)=>'<button class="opt" data-i="'+ci+'" onclick="pick('+ci+')"><span class="l">'+LETTERS[ci]+'</span><span>'+esc(q.c[oi])+"</span></button>").join("");
  view(`<span class="crumb" onclick="confirmExit()">← End session</span>
  <div class="card">
    <div class="meta"><span>${S.label} · Question ${S.i+1} of ${S.list.length}</span>
    <span>${DOMS[q.d][0]}</span>${S.secs>0?'<span class="timer" id="tmr">'+fmt(S.secs)+"</span>":""}</div>
    <div class="bar"><i style="width:${(S.i)/S.list.length*100}%"></i></div>
    <div class="q">${esc(q.q)}</div>${opts}
    <div class="mic" id="mic"><span class="dot"></span><span></span></div>
    <div class="small">Keyboard: <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer${S.mode!=="exam"?", <kbd>Enter</kbd> for next":""} · Voice: say the letter, or “repeat”</div>
  </div>`);
  S.phase="question";
  micUI(listening);
  readCurrent();
}
function readCurrent(){
  const q=QB[S.list[S.i]];
  if(S.phase==="question"){
    let t="Question "+(S.i+1)+". "+q.q+" ... ";
    S.perm.forEach((oi,i)=>{t+="Option "+LETTERS[i]+": "+q.c[oi]+". "});
    speak(t);
  }else{
    const g=S.answers[S.i];const q2=QB[S.list[S.i]];
    speak((g===q2.a?"Correct. ":"Incorrect. The answer is "+LETTERS[S.perm.indexOf(q2.a)]+". ")+q2.x+" ... Say next to continue.");
  }
}
function pick(di){ // di = displayed position; map to original option index
  if(!S||S.phase!=="question"||!S.perm||di>=S.perm.length)return;
  answer(S.perm[di]);
}
function answer(ci){
  if(!S||S.phase!=="question")return;
  const gi=S.list[S.i],q=QB[gi];
  S.answers[S.i]=ci;
  if(S.mode==="exam"){
    speechSynthesis.cancel();
    if(S.i+1<S.list.length){S.i++;renderQ()}else finishSession(false);
    return;
  }
  record(gi,ci===q.a);
  S.phase="feedback";
  document.querySelectorAll(".opt").forEach(b=>{
    const bi=+b.dataset.i,oi=S.perm[bi];b.disabled=true;
    if(oi===q.a)b.classList.add("right");
    else if(oi===ci)b.classList.add("wrong");
  });
  const good=ci===q.a;
  const div=document.createElement("div");
  div.className="expl "+(good?"good":"poor");
  div.innerHTML="<b>"+(good?"✓ Correct":"✗ Incorrect — answer is "+LETTERS[S.perm.indexOf(q.a)])+".</b> "+esc(q.x);
  const card=document.querySelector(".card");
  card.insertBefore(div,document.getElementById("mic"));
  const btn=document.createElement("button");
  btn.className="btn";btn.textContent=S.i+1<S.list.length?"Next question →":"Finish";
  btn.onclick=nextQ;card.appendChild(btn);
  readCurrent();
}
function nextQ(){
  if(!S||S.phase!=="feedback")return;
  speechSynthesis.cancel();
  if(S.i+1<S.list.length){S.i++;renderQ()}else finishSession(false);
}
function confirmExit(){
  if(S&&S.answers.filter(a=>a!==undefined).length>0&&S.mode==="exam"){if(!confirm("End the exam now? Answered questions will be scored."))return;finishSession(true);return}
  endSession();go("home");
}
function endSession(){S=null;if(timerInt)clearInterval(timerInt);speechSynthesis.cancel()}
function finishSession(timedOut){
  if(timerInt)clearInterval(timerInt);
  const res={label:S.label,mode:S.mode,total:S.list.length,right:0,byDom:{},wrong:[]};
  S.list.forEach((gi,ix)=>{
    const q=QB[gi],g=S.answers[ix];
    const correct=g===q.a;
    if(S.mode==="exam")record(gi,correct);
    res.byDom[q.d]=res.byDom[q.d]||{r:0,t:0};
    res.byDom[q.d].t++;
    if(correct){res.right++;res.byDom[q.d].r++}
    else res.wrong.push({gi,g});
  });
  if(S.mode==="exam"){P.exams.push({when:Date.now(),label:S.label,pct:Math.round(res.right/res.total*100),right:res.right,total:res.total});save()}
  const pct=Math.round(res.right/res.total*100);
  const pass=pct>=PASS;
  endSession();
  let rows="";
  for(const d in res.byDom){const b=res.byDom[d];rows+="<tr><td>"+DOMS[d][0]+"</td><td>"+b.r+"/"+b.t+"</td><td>"+Math.round(b.r/b.t*100)+"%</td></tr>"}
  let wrongHtml="";
  if(res.wrong.length){
    wrongHtml='<div class="card"><h3>Review your misses</h3>'+res.wrong.map(w=>{
      const q=QB[w.gi];
      return '<div style="margin:12px 0;padding-bottom:10px;border-bottom:1px solid var(--line)"><b>'+esc(q.q)+"</b><br><span style='color:var(--bad)'>Your answer: "+(w.g===undefined||w.g<0?"— (skipped)":esc(q.c[w.g]))+"</span><br><span style='color:var(--ok)'>Correct: "+esc(q.c[q.a])+"</span><br><span class='sub'>"+esc(q.x)+"</span></div>";
    }).join("")+'<button class="btn2" onclick="drillMissed()">Drill these again</button></div>';
  }
  lastMissed=res.wrong.map(w=>w.gi);
  view(`<div class="card" style="text-align:center">
    <div class="pill">${res.label}${timedOut&&S===null?"":""}</div>
    <div class="score ${pass?"pass":"fail"}">${pct}%</div>
    <p>${res.right} of ${res.total} correct — ${pass?"that's a passing score (need "+PASS+"%) 🎉":"below the "+PASS+"% pass line. Keep drilling."}</p>
    <table><tr><th>Domain</th><th>Score</th><th>%</th></tr>${rows}</table>
    <div class="btnrow" style="justify-content:center"><button class="btn" onclick="go('home')">Dashboard</button><button class="btn2" onclick="go('practice')">Practice more</button></div>
  </div>${wrongHtml}`);
  speak(pass?"You scored "+pct+" percent. That's a pass!":"You scored "+pct+" percent. The pass mark is 74. Let's review your misses.");
}
let lastMissed=[];
function drillMissed(){if(!lastMissed.length)return;startSession({mode:"practice",list:shuffle(lastMissed.slice()),label:"Missed-question drill"})}

/* ---------- adaptive selection ---------- */
function weightFor(i){
  const q=QB[i],s=P.q[i];
  const dst=domStats(q.d);
  const domWeak=dst.acc===null?0.5:(1-dst.acc);
  let w=1+2.5*domWeak;
  if(!s||!s.s)w+=1.6;                 // unseen bonus
  else{
    const wr=s.w/(s.r+s.w);w+=3*wr;   // hammer misses
    if(s.r>=2&&!s.w)w*=0.35;          // mastered = lower volume, never zero
    if(s.last){const days=(Date.now()-s.last)/864e5;w+=Math.min(1.4,0.3*Math.sqrt(days));} // spaced repetition: staleness pulls items back
  }
  return Math.max(w,0.2);             // floor: strong areas stay in rotation
}
function smartPick(n,dom){
  const pool=QB.map((q,i)=>i).filter(i=>!dom||QB[i].d===dom);
  const items=pool.map(i=>({i,w:weightFor(i)}));
  const out=[];
  while(out.length<n&&items.length){
    let tot=items.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(;k<items.length;k++){r-=items[k].w;if(r<=0)break}
    k=Math.min(k,items.length-1);
    out.push(items[k].i);items.splice(k,1);
  }
  return out;
}
function examList(mix){
  let list=[];
  for(const d in mix){
    const pool=shuffle(QB.map((q,i)=>i).filter(i=>QB[i].d===+d));
    list=list.concat(pool.slice(0,mix[d]));
  }
  return shuffle(list);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function view(h){document.getElementById("view").innerHTML=h;window.scrollTo(0,0)}

/* ---------- flashcards ---------- */
let F=null;
function startFlash(dom){
  const pool=FLASH.map((c,i)=>i).filter(i=>!dom||FLASH[i].d===dom);
  const weighted=pool.map(i=>({i,w:1+(P.f[i]&&P.f[i].d?3*P.f[i].d/((P.f[i].k||0)+P.f[i].d):0)+((P.f[i]&&(P.f[i].k||P.f[i].d))?0:1)}));
  const list=[];
  while(list.length<Math.min(20,weighted.length)&&weighted.length){
    let tot=weighted.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(;k<weighted.length;k++){r-=weighted[k].w;if(r<=0)break}
    k=Math.min(k,weighted.length-1);
    list.push(weighted[k].i);weighted.splice(k,1);
  }
  F={list,i:0,flipped:false};renderFlash();
}
function renderFlash(){
  const c=FLASH[F.list[F.i]];
  view(`<span class="crumb" onclick="F=null;go('flash')">← Flashcards</span>
  <div class="card" style="padding:14px"><div class="meta"><span>Card ${F.i+1} of ${F.list.length}</span><span>${DOMS[c.d][0]}</span></div></div>
  <div class="fc" onclick="flipCard()">
    <div class="f">${esc(c.f)}</div>
    ${F.flipped?'<div class="b">'+esc(c.b)+"</div>":'<div class="hint">tap / space to reveal</div>'}
  </div>
  ${F.flipped?'<div class="btnrow" style="justify-content:center"><button class="btn2" style="background:var(--badbg);color:var(--bad)" onclick="gradeCard(false)">✗ Didn&#39;t know</button><button class="btn2" style="background:var(--okbg);color:var(--ok)" onclick="gradeCard(true)">✓ Knew it</button></div>':""}
  <div class="mic" id="mic"><span class="dot"></span><span></span></div>`);
  micUI(listening);
  speak(c.f+(F.flipped?" ... "+c.b:""));
}
function flipCard(){F.flipped=!F.flipped;renderFlash()}
function gradeCard(knew){
  const i=F.list[F.i];
  P.f[i]=P.f[i]||{k:0,d:0};knew?P.f[i].k++:P.f[i].d++;save();
  if(F.i+1<F.list.length){F.i++;F.flipped=false;renderFlash()}
  else{const done=F.list.length;F=null;view('<div class="card" style="text-align:center"><h2>Deck complete 🎴</h2><p class="sub">'+done+' cards reviewed. Weak cards will come back more often.</p><div class="btnrow" style="justify-content:center"><button class="btn" onclick="go(\'flash\')">Another deck</button><button class="btn2" onclick="go(\'home\')">Dashboard</button></div></div>')}
}

let dict=null,dictOn=false;
function stopDictate(){
  dictOn=false;
  if(dict){try{dict.onend=null;dict.stop()}catch(e){}}

function toggleDictate(){
  if(dictOn){stopDictate();return}
  if(!SR){alert("Dictation isn't supported in this browser. Chrome, Edge, or Safari work best.");return}
  if(voiceIn)toggleVoice("in"); // can't run two recognizers at once
  dict=new SR();dict.lang="en-US";dict.continuous=true;dict.interimResults=false;
  dict.onresult=e=>{
    let t="";
    for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)t+=e.results[k][0].transcript+" ";
    const ta=document.getElementById("essayTa");

  dict.onerror=e=>{if(e.error==="not-allowed"){stopDictate();alert("Microphone blocked — allow mic access and try again.")}};
  dictOn=true;

}

  </div>
  <div class="grid">
    <div class="mode" onclick="startSession({mode:'practice',list:smartPick(15),label:'Smart Drill'})"><span class="ic">🎯</span><b>Smart Drill</b><p>15 adaptive questions targeting your weak areas and misses. Best daily habit.</p></div>
    <div class="mode" onclick="go('practice')"><span class="ic">📝</span><b>Practice by domain</b><p>Untimed questions with full explanations, filtered to any domain.</p></div>
    <div class="mode" onclick="go('exam')"><span class="ic">⏱️</span><b>Exam simulation</b><p>Timed 30-question module (30 min) or full 120-question exam (2 hrs).</p></div>
    <div class="mode" onclick="go('essay')"><span class="ic">✍️</span><b>Essay practice</b><p>${ESSAYS.length} written/narrated questions with model answers — the real exam includes essays.</p></div>
    <div class="mode" onclick="go('flash')"><span class="ic">🎴</span><b>Flashcards</b><p>${FLASH.length} rapid-recall cards for frameworks, formulas, and definitions.</p></div>
    <div class="mode" onclick="go('learn')"><span class="ic">📚</span><b>Learn</b><p>Concept summaries per domain with the classic exam traps flagged.</p></div>
    <div class="mode" onclick="go('review')"><span class="ic">🔁</span><b>Review misses</b><p>Re-drill every question you've ever gotten wrong until it sticks.</p></div>
  </div>
  <p class="small">Tip: turn on 🔊 + 🎙️ in the header for a hands-free voice loop — questions are read aloud and you answer by saying "A", "B", "C", or "D".</p>`);
}
function learn(d){
  if(!d){
    let items="";
    for(const k in DOMS){const st=domStats(+k);items+='<div class="mode" onclick="go(\'learn\','+k+')"><b>'+DOMS[k][0]+'</b><p>'+CONCEPTS[k].weight+(st.acc!==null?" · currently "+Math.round(st.acc*100)+"% correct":"")+"</p></div>"}
    view('<div class="card"><h2>Learn the material</h2><p class="sub">Six domains, ordered by exam weight. Read, then drill.</p></div><div class="grid">'+items+"</div>");
    return;
  }
  const c=CONCEPTS[d];
  view(`<span class="crumb" onclick="go('learn')">← All domains</span>
  <div class="card learn"><div class="pill">${c.weight}</div><h2>${c.title}</h2>${c.html}
  <div class="btnrow"><button class="btn" onclick="startSession({mode:'practice',list:smartPick(10,${d}),label:'${c.title.replace(/'/g,"\\'")} drill'})">Drill this domain →</button><button class="btn2" onclick="startFlash(${d})">Flashcards</button></div></div>`);
}
function practiceSetup(){
  let chips='<div class="chip on" data-d="0" onclick="pickDom(this)">All (adaptive)</div>';
  for(const d in DOMS)chips+='<div class="chip" data-d="'+d+'" onclick="pickDom(this)">'+DOMS[d][0]+"</div>";
  view(`<span class="crumb" onclick="go('home')">← Dashboard</span>
  <div class="card"><h2>Practice quiz</h2><p class="sub">Untimed, immediate feedback with explanations. Adaptive selection favors weak areas.</p>
  <h3>Domain</h3><div class="chips" id="domChips">${chips}</div>
  <h3>Length</h3><div class="chips" id="lenChips"><div class="chip" onclick="pickLen(this)">10</div><div class="chip on" onclick="pickLen(this)">15</div><div class="chip" onclick="pickLen(this)">25</div><div class="chip" onclick="pickLen(this)">40</div></div>
  <div class="btnrow"><button class="btn" onclick="launchPractice()">Start practice →</button></div></div>`);
}
function pickDom(el){document.querySelectorAll("#domChips .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on")}
function pickLen(el){document.querySelectorAll("#lenChips .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on")}
function launchPractice(){
  const d=+document.querySelector("#domChips .chip.on").dataset.d;
  const n=+document.querySelector("#lenChips .chip.on").textContent;
  startSession({mode:"practice",list:smartPick(n,d||null),label:d?DOMS[d][0]+" practice":"Adaptive practice"});
}
function examSetup(){
  view(`<span class="crumb" onclick="go('home')">← Dashboard</span>
  <div class="card"><h2>Exam simulation</h2>
  <p class="sub">Mirrors the real CPM exam: domain-weighted questions, strict timer, no feedback until the end, 74% to pass. The real exam is 4 modules of 30 questions / 30 minutes.</p>
  <div class="grid">
    <div class="mode" onclick="startSession({mode:'exam',list:examList(MOD_MIX),secs:1800,label:'30-question module'})"><span class="ic">⏱️</span><b>One module</b><p>30 questions · 30 minutes — matches one real exam module.</p></div>
    <div class="mode" onclick="startSession({mode:'exam',list:examList(FULL_MIX),secs:7200,label:'Full 120-question exam'})"><span class="ic">🏁</span><b>Full exam</b><p>120 questions · 2 hours — the complete dress rehearsal.</p></div>
  </div></div>`);
}
function flashSetup(){
  let items='<div class="mode" onclick="startFlash(null)"><b>Mixed deck</b><p>20 cards across all domains, weighted toward ones you miss.</p></div>';
  for(const d in DOMS){const n=FLASH.filter(c=>c.d===+d).length;items+='<div class="mode" onclick="startFlash('+d+')"><b>'+DOMS[d][0]+"</b><p>"+n+" cards</p></div>"}
  view('<span class="crumb" onclick="go(\'home\')">← Dashboard</span><div class="card"><h2>Flashcards</h2><p class="sub">Tap to flip, then grade yourself honestly — "didn\'t know" cards return more often.</p></div><div class="grid">'+items+"</div>");
}
function review(){
  const missed=QB.map((q,i)=>i).filter(i=>P.q[i]&&P.q[i].w>0);
  const stubborn=missed.filter(i=>P.q[i].w>P.q[i].r);
  if(!missed.length){view('<span class="crumb" onclick="go(\'home\')">← Dashboard</span><div class="card"><h2>Review misses</h2><p class="sub">Nothing to review yet — answer some questions first and your misses will collect here.</p></div>');return}
  view(`<span class="crumb" onclick="go('home')">← Dashboard</span>
  <div class="card"><h2>Review misses</h2>
  <p class="sub">You've missed ${missed.length} distinct questions; ${stubborn.length} are still net-negative (more wrong than right).</p>
  <div class="btnrow">
    ${stubborn.length?'<button class="btn" onclick="startSession({mode:\'practice\',list:shuffle(['+stubborn+']).slice(0,25),label:\'Stubborn-miss drill\'})">Drill stubborn misses →</button>':""}
    <button class="${stubborn.length?"btn2":"btn"}" onclick="startSession({mode:'practice',list:shuffle([${missed}]).slice(0,25),label:'Miss review'})">Drill all misses →</button>
  </div></div>`);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(F){if(e.key===" "){e.preventDefault();flipCard()}else if(F.flipped&&(e.key==="1"||e.key.toLowerCase()==="x"))gradeCard(false);else if(F.flipped&&(e.key==="2"||e.key.toLowerCase()==="k"))gradeCard(true);return}
  if(!S)return;
  if(S.phase==="question"){
    const k=e.key.toLowerCase();
    const idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):("1234".indexOf(k)>=0?"1234".indexOf(k):-1);
    if(idx>=0&&idx<QB[S.list[S.i]].c.length)pick(idx);
  }else if(S.phase==="feedback"&&e.key==="Enter")nextQ();
});

/* ---------- boot ---------- */
home();
</script>
</body>
</html>
